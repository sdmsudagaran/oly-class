             let processedResults = filterSchool === 'Semua' ? [...results] : results.filter(r => r.participant?.school === filterSchool);
             processedResults = sortOlympiadResults(processedResults);

             const scores = processedResults.map(r => r.score);
             const validCount = scores.length;
             const meanScore = validCount > 0 ? (scores.reduce((a,b) => a + b, 0) / validCount) : 0;
             const variance = validCount > 0 ? (scores.reduce((a,b) => a + Math.pow(b - meanScore, 2), 0) / validCount) : 0;
             const stdDeviation = Math.sqrt(variance);

             return (
                <AdminLayout title="Cetak Rekapitulasi Resmi">
                   <div className="mb-8 flex flex-col sm:flex-row justify-between items-center gap-4 bg-white p-6 rounded-3xl border border-slate-200 shadow-sm print:hidden">
                      <div className="flex flex-wrap items-center gap-3 w-full sm:w-auto">
                         <span className="text-[10px] font-black uppercase tracking-widest text-slate-400">Filter Institusi:</span>
                         <select value={filterSchool} onChange={e=>setFilterSchool(e.target.value)} className="border-2 border-slate-200 rounded-xl p-3 text-[14px] font-bold bg-slate-50 outline-none cursor-pointer text-slate-700">
                            {schoolList.map(s => <option key={s} value={s}>{s}</option>)}
                         </select>
                      </div>
                      <div className="flex items-center gap-3 w-full sm:w-auto">
                         <button onClick={fetchSupabaseData} className="bg-slate-100 text-slate-600 p-3.5 rounded-xl hover:bg-slate-200 transition-colors"><i className="fas fa-sync-alt"></i></button>
                         <button onClick={() => window.print()} className="w-full sm:w-auto bg-primary-800 hover:bg-primary-900 text-white px-8 py-3.5 rounded-xl font-black uppercase tracking-widest text-xs flex items-center justify-center transition-all shadow-lg"><i className="fas fa-print mr-2"></i> Buat Dokumen PDF</button>
                      </div>
                   </div>
                   
                   <div className="bg-white border shadow-md mx-auto w-full max-w-[21.5cm] min-h-[33cm] p-10 sm:p-14 relative text-primary-900 font-sans" style={{background: 'white'}}>
                      <div className="text-center border-b-4 border-primary-800 pb-6 mb-8 mt-2">
                         <h1 className="text-[24px] font-black uppercase tracking-widest text-primary-800 mb-2">Rekapitulasi Hasil Olimpiade</h1>
                         <p className="text-slate-600 font-bold tracking-wider">{organizerName}</p>
                      </div>
                      
                      <div className="mb-10 grid grid-cols-2 md:grid-cols-4 gap-6 text-[14px] bg-slate-50 p-6 rounded-2xl border-2 border-slate-200">
                         <div><p className="text-slate-500 text-[9px] font-black uppercase tracking-widest mb-1">Filter Institusi</p><p className="font-black text-primary-900 text-[16px]">{filterSchool}</p></div>
                         <div><p className="text-slate-500 text-[9px] font-black uppercase tracking-widest mb-1">Populasi</p><p className="font-black text-primary-900 text-[16px]">{validCount} Siswa</p></div>
                         <div><p className="text-slate-500 text-[9px] font-black uppercase tracking-widest mb-1">Rata-Rata (Mean)</p><p className="font-black text-primary-900 text-[16px]">{meanScore.toFixed(2)}</p></div>
                         <div><p className="text-slate-500 text-[9px] font-black uppercase tracking-widest mb-1">Deviasi Standar</p><p className="font-black text-primary-900 text-[16px]">± {stdDeviation.toFixed(2)}</p></div>
                      </div>
                      
                      <table className="w-full text-left border-collapse border-2 border-primary-800 text-[14px] font-semibold">
                         <thead className="bg-slate-100 uppercase font-black tracking-widest text-[9px] text-slate-700">
                            <tr className="border-b-2 border-primary-800">
                                <th className="border-r border-primary-800 py-4 px-3 text-center w-12">Rnk</th>
                                <th className="border-r border-primary-800 py-4 px-3">Nama Identitas Lengkap</th>
                                <th className="border-r border-primary-800 py-4 px-3">Sekolah / Asal</th>
                                <th className="border-r border-primary-800 py-4 px-3 text-center w-32">Skor Poin</th>
                                <th className="border-r border-primary-800 py-4 px-3 text-center w-24">Nilai ITO</th>
                                <th className="py-4 px-3 text-center w-24">Peringatan</th>
                            </tr>
                         </thead>
                         <tbody>
                            {processedResults.map((r, i) => {
                               const details = r.detail?.detailedResults || [];
                               const cheats = details.find(x => x.qId === 'SYS_CHEATS')?.cheatCount || 0;
                               const s = r.detail?.stats || {};
                               return (
                               <tr key={i} className="border-b border-slate-300">
                                  <td className="border-r border-primary-800 py-3 px-3 text-center font-black">{i+1}</td>
                                  <td className="border-r border-primary-800 py-3 px-3 uppercase">{r.participant?.name}</td>
                                  <td className="border-r border-primary-800 py-3 px-3">{r.participant?.school}</td>
                                  <td className="border-r border-primary-800 py-3 px-3 text-center font-black text-[16px]">{r.score}</td>
                                  <td className="border-r border-primary-800 py-3 px-3 text-center font-black">{(s.ito||0).toFixed(1)}</td>
                                  <td className="py-3 px-3 text-center text-[10px] font-black">{cheats === 0 ? '-' : `${cheats}x`}</td>
                               </tr>
                            )})}
                            {processedResults.length === 0 && <tr><td colSpan="6" className="text-center py-16 text-slate-500 font-bold uppercase tracking-widest">Tidak ada data.</td></tr>}
                         </tbody>
                      </table>
                      <div className="mt-24 flex justify-end text-center text-primary-900 font-bold text-[14px] uppercase tracking-widest"><div><p className="mb-24">Mengesahkan,<br/>Komite Olimpiade Daerah</p><p className="font-black">_______________________</p></div></div>
                   </div>
                </AdminLayout>
             );
          };

          // --- ROUTER Switch ---
          const renderRoute = () => {
            switch (currentRoute) {
              case '/': case '/login': return <ParticipantLogin />;
              case '/instruction': return <ParticipantInstruction />;
              case '/exam': return <ExamEngine />;
              case '/review': return <ExamReview />;
              case '/submitted': return <ExamSubmitted />;
              case '/admin': case '/admin/login': return <AdminLogin />;
              case '/admin/dashboard': return <AdminDashboard />;
              case '/admin/tokens': return <AdminTokens />;
              case '/admin/results': return <AdminResults />;
              case '/admin/questions': return <AdminQuestions />;
              case '/admin/analysis': return <AdminItemAnalysis />;
              case '/admin/reports': return <AdminReports />;
              default: return <ParticipantLogin />;
            }
          };

          return (
             <React.Fragment>
                {/* CustomDialog sekarang dirender secara aman di level root tanpa melanggar Rules of Hooks */}
                <CustomDialog dialog={dialog} onClose={() => setDialog(null)} />
                {renderRoute()}
             </React.Fragment>
          );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
