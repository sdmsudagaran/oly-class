             const displayedMassEditTokens = editFilter === 'Semua' ? massEditTokens : massEditTokens.filter(t => t.participant_school === editFilter);

             const handleSelectAll = (e) => { if (e.target.checked) setSelectedTokens(actualTokens.map(t => t.code)); else setSelectedTokens([]); };
             const handleSelectAllEdit = (e) => { if (e.target.checked) setSelectedTokens(displayedMassEditTokens.map(t => t.code)); else setSelectedTokens([]); };
             const handleSelectToken = (code) => { if (selectedTokens.includes(code)) setSelectedTokens(selectedTokens.filter(t => t !== code)); else setSelectedTokens([...selectedTokens, code]); };

             const handleDeleteSelected = async () => {
                 if (selectedTokens.length === 0) return;
                 showConfirm(`Apakah Anda yakin ingin menghapus permanen ${selectedTokens.length} data terpilih?`, async () => {
                     setIsSaving(true);
                     try {
                         const db = await getSupabase();
                         const { error } = await db.from('tokens').delete().in('code', selectedTokens);
                         if (error) throw error;
                         await fetchSupabaseData(); setSelectedTokens([]); 
                         showAlert("Data terpilih berhasil dihapus.");
                     } catch (err) { showAlert("Gagal hapus masal: " + err.message); } finally { setIsSaving(false); }
                 });
             };

             const downloadPeserta = () => {
                 let validTokens = actualTokens;
                 if (downloadFilter !== 'Semua') validTokens = validTokens.filter(t => t.participant_school === downloadFilter);
                 if (validTokens.length === 0) return showAlert("Tidak ada data untuk dicetak.");
                 
                 const printWindow = window.open('', '_blank');
                 let tableRowsHTML = '';
                 validTokens.forEach((t, i) => { tableRowsHTML += `<tr><td class="text-center">${i + 1}</td><td style="text-transform: uppercase; font-weight: bold;">${t.participant_name || '-'}</td><td>${t.participant_school || '-'}</td><td class="text-center" style="font-family: monospace; font-size:14px; font-weight:bold;">${t.code}</td><td class="text-center">${t.status}</td></tr>`; });

                 printWindow.document.write(`
                     <html><head><style>
                         body { font-family: sans-serif; padding: 20px; font-size: 12px; }
                         h2 { text-align: center; text-transform: uppercase; margin-bottom: 20px; }
                         table { width: 100%; border-collapse: collapse; }
                         th, td { border: 1px solid #000; padding: 8px; }
                         th { background-color: #eee; }
                         .text-center { text-align: center; }
                     </style></head><body>
                         <h2>Daftar Token Akses Peserta</h2>
                         <table><thead><tr><th class="text-center">No</th><th>Nama Peserta</th><th>Asal Sekolah</th><th class="text-center">Token</th><th class="text-center">Status</th></tr></thead><tbody>${tableRowsHTML}</tbody></table>
                         <script>window.onload=function(){window.print(); window.close();}</${'script'}>
                     </body></html>
                 `);
                 printWindow.document.close();
             };

             const downloadTemplate = () => {
                 const csvContent = "Nama Peserta,Asal Sekolah\nJohn Doe,SDN 1 Pusat\nJane Doe,SDN 2 Pusat\n";
                 const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                 const link = document.createElement("a");
                 link.href = URL.createObjectURL(blob);
                 link.download = "Template_Token_Peserta.csv";
                 link.click();
             };

             const handleFileUpload = (e) => {
                 const file = e.target.files[0];
                 if (!file) return;
                 const reader = new FileReader();
                 reader.onload = async (event) => {
                     const lines = event.target.result.split('\n').filter(l => l.trim() !== '');
                     const payloads = [];
                     for (let i = (lines[0].toLowerCase().includes('nama') ? 1 : 0); i < lines.length; i++) {
                         const cols = lines[i].split(lines[i].includes(';') ? ';' : ',');
                         if (cols[0]) payloads.push({ code: `OLY-${Math.random().toString(36).substring(2,7).toUpperCase()}`, status: 'AVAILABLE', participant_name: cols[0].replace(/["\r]/g, '').trim(), participant_school: cols[1]?.replace(/["\r]/g, '').trim() || '', generatedAt: new Date().toISOString() });
                     }
                     if (payloads.length === 0) { showAlert('Format kosong atau salah.'); return; }
                     setIsSaving(true);
                     try { const db = await getSupabase(); await db.from('tokens').insert(payloads); setShowImport(false); fetchSupabaseData(); showAlert("Data token peserta berhasil diimpor."); } catch(err) { showAlert("Gagal impor: " + err.message); } finally { setIsSaving(false); }
                 };
                 reader.readAsText(file);
             };

             const addManualConfirm = async () => {
                 if (!manualForm.name) return;
                 const newCode = `OLY-${Math.random().toString(36).substring(2,7).toUpperCase()}`;
                 setIsSaving(true);
                 try {
                     const db = await getSupabase();
                     await db.from('tokens').insert([{ code: newCode, status: 'AVAILABLE', participant_name: manualForm.name, participant_school: manualForm.school, generatedAt: new Date().toISOString() }]);
                     fetchSupabaseData(); setShowAddManualModal(false); setManualForm({name:'', school:''});
                     showAlert("Data token ditambahkan secara manual.");
                 } catch(e) { showAlert(e.message); }
                 setIsSaving(false);
             };

             const startMassEdit = () => {
                 setEditFilter('Semua');
                 setMassEditTokens(JSON.parse(JSON.stringify(selectedTokens.length > 0 ? actualTokens.filter(t => selectedTokens.includes(t.code)) : actualTokens)));
                 setSelectedTokens([]); setIsMassEdit(true);
             };

             const handleMassEditChange = (index, field, value) => { const updated = [...massEditTokens]; updated[index][field] = value; setMassEditTokens(updated); };
             const handleBulkEditStatus = (status) => { const updated = massEditTokens.map(t => selectedTokens.includes(t.code) ? { ...t, status } : t); setMassEditTokens(updated); };

             const saveMassEdit = async () => {
                 setIsSaving(true);
                 try {
                     const db = await getSupabase();
                     await db.from('tokens').upsert(massEditTokens.map(t => ({ code: t.code, status: t.status, participant_name: t.participant_name, participant_school: t.participant_school })));
                     fetchSupabaseData(); setIsMassEdit(false); setSelectedTokens([]); 
                     showAlert("Pembaruan masal berhasil disimpan.");
                 } catch(e) { showAlert(e.message); }
                 setIsSaving(false);
             };

             const deleteToken = async (code) => {
                 showConfirm(`Hapus token ${code}?`, async () => { setIsSaving(true); try { const db = await getSupabase(); await db.from('tokens').delete().eq('code', code); fetchSupabaseData(); showAlert("Token berhasil dihapus."); } catch(e) { showAlert(e.message); } setIsSaving(false); });
             };

             return (
               <AdminLayout title="Kelola Token Peserta">
                 <div className="bg-white p-5 rounded-3xl border mb-6 flex flex-wrap gap-4 items-center justify-between shadow-sm">
                    {!isMassEdit ? (
                        <>
                            <div className="flex gap-3">
                                <button onClick={() => setShowAddManualModal(true)} className="bg-success hover:bg-success-600 text-white px-5 py-3 rounded-xl text-xs font-black uppercase tracking-wider transition-colors shadow-sm"><Plus size={14} className="inline mr-1.5"/> Manual</button>
                                <button onClick={() => setShowImport(true)} className="bg-primary-600 hover:bg-primary-700 text-white px-5 py-3 rounded-xl text-xs font-black uppercase tracking-wider transition-colors shadow-sm"><Upload size={14} className="inline mr-1.5"/> Impor CSV</button>
                                <button onClick={startMassEdit} disabled={actualTokens.length===0} className="bg-primary-800 hover:bg-primary-900 text-white px-5 py-3 rounded-xl text-xs font-black uppercase tracking-wider transition-colors shadow-sm disabled:opacity-50">
                                    <Edit size={14} className="inline mr-1.5"/> {selectedTokens.length > 0 ? `Edit (${selectedTokens.length})` : 'Edit'}
                                </button>
                                {selectedTokens.length > 0 && (
                                    <button onClick={handleDeleteSelected} disabled={isSaving} className="bg-rose-100 text-rose-700 hover:bg-rose-200 px-5 py-3 rounded-xl font-black text-xs uppercase tracking-wider shadow-sm transition-colors">
                                        <Trash2 size={14} className="inline mr-1.5"/> Hapus ({selectedTokens.length})
                                    </button>
                                )}
                            </div>
                            <div className="flex items-center gap-3">
                                <select value={downloadFilter} onChange={(e) => setDownloadFilter(e.target.value)} className="bg-slate-50 border border-slate-200 text-xs font-bold rounded-xl px-4 py-3 outline-none focus:border-primary-500 text-slate-700">
                                    <option value="Semua">Semua Filter</option>
                                    {uniqueClasses.map((cls, idx) => <option key={idx} value={cls}>{cls}</option>)}
                                </select>
                                <button onClick={downloadPeserta} className="bg-white text-slate-700 hover:bg-slate-50 px-5 py-3 rounded-xl font-black uppercase text-xs transition-colors border border-slate-200 shadow-sm"><i className="fas fa-print mr-2"></i> Cetak</button>
                            </div>
                        </>
                    ) : (
                        <>
                            <div className="flex gap-3">
                                <button onClick={saveMassEdit} disabled={isSaving} className="bg-success hover:bg-success-600 text-white px-6 py-3 rounded-xl text-xs font-black uppercase tracking-wider shadow-md"><Save size={14} className="inline mr-1.5"/> Simpan Perubahan</button>
                                <button onClick={() => { setIsMassEdit(false); setSelectedTokens([]); }} className="bg-white border-2 border-slate-200 text-slate-700 hover:bg-slate-50 px-6 py-3 rounded-xl text-xs font-black uppercase tracking-wider">Batal</button>
                            </div>
                            <div className="flex items-center gap-3">
                                <span className="text-[10px] font-black uppercase tracking-widest text-slate-400">Filter View:</span>
                                <select value={editFilter} onChange={e => {setEditFilter(e.target.value); setSelectedTokens([]);}} className="bg-slate-50 border border-slate-200 text-xs font-bold rounded-xl px-4 py-3 outline-none text-slate-700">
                                    <option value="Semua">Semua Tampilan</option>
                                    {uniqueEditClasses.map((cls, idx) => <option key={idx} value={cls}>{cls}</option>)}
                                </select>
                            </div>
                        </>
                    )}
                 </div>

                 {showImport && (
                     <div className="fixed inset-0 modal-overlay z-[9999] flex items-center justify-center p-4">
                        <div className="bg-white rounded-3xl shadow-xl w-full max-w-md p-8 border-t-4 border-primary-600 animate-fade-in-up">
                            <div className="flex justify-between items-center mb-6"><h3 className="text-xl font-black text-slate-800 uppercase tracking-widest">Impor CSV</h3><button onClick={()=>setShowImport(false)} className="text-slate-400 hover:text-slate-700 bg-slate-100 p-2 rounded-lg"><X size={16}/></button></div>
                            <button onClick={downloadTemplate} className="mb-6 w-full bg-primary-50 border border-primary-100 text-primary-700 hover:bg-primary-100 py-3 rounded-xl text-xs font-black uppercase tracking-wider flex items-center justify-center transition-colors"><FileText size={16} className="mr-2"/> Download Format File</button>
                            <div className="border-2 border-dashed border-slate-300 rounded-2xl p-10 text-center hover:bg-slate-50 transition-colors relative group cursor-pointer">
                                <Upload size={40} className="text-slate-300 mx-auto mb-3 group-hover:text-primary-500 transition-colors" />
                                <p className="font-bold text-slate-600 mb-1">Klik / Seret File Kesini</p>
                                <input type="file" accept=".csv" onChange={handleFileUpload} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer"/>
                            </div>
                        </div>
                     </div>
                 )}

                 {showAddManualModal && (
                    <div className="fixed inset-0 modal-overlay z-[9999] flex items-center justify-center p-4">
                        <div className="bg-white rounded-3xl shadow-xl w-full max-w-md p-8 border-t-4 border-success animate-fade-in-up">
                            <h3 className="text-xl font-black text-slate-800 uppercase tracking-widest mb-6">Tambah Manual</h3>
                            <div className="space-y-5 mb-8">
                                <div><label className="block text-[10px] font-black uppercase tracking-widest text-slate-500 mb-2">Nama Lengkap</label><input value={manualForm.name} onChange={e=>setManualForm({...manualForm, name: e.target.value})} className="w-full p-4 border border-slate-200 rounded-xl focus:ring-2 focus:ring-success outline-none text-[15px] font-semibold" autoFocus /></div>
                                <div><label className="block text-[10px] font-black uppercase tracking-widest text-slate-500 mb-2">Sekolah / Asal</label><input value={manualForm.school} onChange={e=>setManualForm({...manualForm, school: e.target.value})} className="w-full p-4 border border-slate-200 rounded-xl focus:ring-2 focus:ring-success outline-none text-[15px] font-semibold" /></div>
                            </div>
                            <div className="flex gap-3">
                                 <button onClick={()=>setShowAddManualModal(false)} className="flex-1 py-3.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl text-xs font-black uppercase tracking-wider transition-colors">Batal</button>
                                 <button onClick={addManualConfirm} disabled={isSaving} className="flex-1 py-3.5 bg-success hover:bg-success-600 text-white rounded-xl text-xs font-black uppercase tracking-wider shadow-md transition-colors">Simpan</button>
                            </div>
                        </div>
                    </div>
                 )}
                 
                 <div className="bg-white rounded-3xl border overflow-hidden shadow-sm">
                    <table className="w-full text-left text-sm">
                        <thead className="bg-slate-50">
                            <tr>
                                <th className="py-4 px-4 text-center w-12 border-b">
                                    <input type="checkbox" className="w-4 h-4 cursor-pointer accent-primary-600 rounded" onChange={isMassEdit ? handleSelectAllEdit : handleSelectAll} checked={selectedTokens.length > 0 && selectedTokens.length === (isMassEdit ? displayedMassEditTokens.length : actualTokens.length)} />
                                </th>
                                <th className="py-4 px-4 w-12 text-center text-[10px] font-black uppercase tracking-widest text-slate-400 border-b">No</th>
                                <th className="py-4 px-4 text-[10px] font-black uppercase tracking-widest text-slate-400 border-b">Identitas Peserta</th>
                                <th className="py-4 px-4 text-[10px] font-black uppercase tracking-widest text-slate-400 border-b">Token Validasi</th>
                                {isMassEdit ? (
                                    <th className="py-4 px-4 min-w-[160px] text-[10px] font-black uppercase tracking-widest text-slate-400 border-b">
                                        Status
                                        <select onChange={(e) => { if(e.target.value) handleBulkEditStatus(e.target.value); e.target.value=''; }} className="block mt-2 w-full border border-slate-300 rounded-lg text-xs font-bold text-slate-700 bg-white p-2 outline-none cursor-pointer">
                                            <option value="">Set Terpilih...</option>
                                            <option value="AVAILABLE">AVAILABLE</option>
                                            <option value="USED">USED</option>
                                            <option value="EXPIRED">EXPIRED</option>
                                        </select>
                                    </th>
                                ) : (
                                    <th className="py-4 px-4 text-center text-[10px] font-black uppercase tracking-widest text-slate-400 border-b">Status</th>
                                )}
                                {!isMassEdit && <th className="py-4 px-4 text-center text-[10px] font-black uppercase tracking-widest text-slate-400 border-b">Aksi</th>}
                            </tr>
                        </thead>
                        <tbody>
                            {isMassEdit ? (
                                displayedMassEditTokens.map((t, idx) => {
                                    const originalIndex = massEditTokens.findIndex(orig => orig.code === t.code);
                                    return (
                                        <tr key={t.code} className={`border-b transition-colors ${selectedTokens.includes(t.code) ? 'bg-primary-50/50' : 'bg-white'}`}>
                                            <td className="p-3 text-center"><input type="checkbox" className="w-4 h-4 cursor-pointer accent-primary-600 rounded" checked={selectedTokens.includes(t.code)} onChange={() => handleSelectToken(t.code)} /></td>
                                            <td className="p-3 text-center text-slate-400 font-bold text-[15px]">{idx+1}</td>
                                            <td className="p-3 space-y-2">
                                                <input type="text" value={t.participant_name} onChange={e=>handleMassEditChange(originalIndex, 'participant_name', e.target.value)} className="w-full p-2.5 border border-slate-200 rounded-lg text-[15px] font-bold uppercase outline-none focus:border-primary-500 bg-slate-50"/>
                                                <input type="text" value={t.participant_school} onChange={e=>handleMassEditChange(originalIndex, 'participant_school', e.target.value)} className="w-full p-2.5 border border-slate-200 rounded-lg text-[14px] font-semibold outline-none focus:border-primary-500 bg-slate-50"/>
                                            </td>
                                            <td className="p-3 font-mono font-bold text-slate-400 text-[15px] tracking-widest">{t.code}</td>
                                            <td className="p-3">
                                                <select value={t.status} onChange={e=>handleMassEditChange(originalIndex, 'status', e.target.value)} className="w-full p-2.5 border border-slate-200 rounded-lg text-[10px] font-black uppercase tracking-wider outline-none cursor-pointer bg-slate-50 text-slate-700">
                                                    <option value="AVAILABLE">AVAILABLE</option><option value="USED">USED</option><option value="EXPIRED">EXPIRED</option>
                                                </select>
                                            </td>
                                        </tr>
                                    );
                                })
                            ) : (
                                actualTokens.map((t, i) => (
                                    <tr key={t.code} className={`border-b border-slate-50 transition-colors ${selectedTokens.includes(t.code) ? 'bg-primary-50/30' : 'hover:bg-slate-50'}`}>
                                        <td className="py-4 px-4 text-center"><input type="checkbox" className="w-4 h-4 cursor-pointer accent-primary-600 rounded" checked={selectedTokens.includes(t.code)} onChange={() => handleSelectToken(t.code)} /></td>
                                        <td className="py-4 px-4 text-center text-slate-400 font-bold text-[15px]">{i+1}</td>
                                        <td className="py-4 px-4">
                                            <div className="font-bold text-slate-800 uppercase text-[16px] mb-1">{t.participant_name || '-'}</div>
                                            <div className="text-[14px] text-slate-500 font-medium">{t.participant_school || '-'}</div>
                                        </td>
                                        <td className="py-4 px-4">
                                            <span className="font-mono font-bold text-primary-700 bg-primary-50 border border-primary-100 px-3 py-1.5 rounded-lg tracking-widest text-[15px]">{t.code}</span>
                                        </td>
                                        <td className="py-4 px-4 text-center"><span className={`px-3 py-1.5 text-[9px] font-black rounded-lg uppercase tracking-widest ${t.status === 'AVAILABLE' ? 'bg-success/20 text-success-700' : t.status === 'USED' ? 'bg-rose-100 text-rose-700' : 'bg-slate-200 text-slate-600'}`}>{t.status}</span></td>
                                        <td className="py-4 px-4 text-center"><button onClick={()=>deleteToken(t.code)} className="text-slate-400 p-2 hover:bg-rose-100 hover:text-rose-600 rounded-xl transition-colors"><Trash2 size={16}/></button></td>
                                    </tr>
                                ))
                            )}
                            {(isMassEdit ? displayedMassEditTokens : actualTokens).length === 0 && <tr><td colSpan={isMassEdit ? 6 : 7} className="text-center py-16 text-slate-400 text-[15px] font-medium">Data kosong.</td></tr>}
                        </tbody>
                    </table>
                 </div>
               </AdminLayout>
             );
          };

          const AdminResults = () => {
             const [selectedAnalysis, setSelectedAnalysis] = useState(null);
             const [filterSchool, setFilterSchool] = useState('Semua');
             const [selectedResults, setSelectedResults] = useState([]);
             const [isDeleting, setIsDeleting] = useState(false);

             const schoolList = ['Semua', ...new Set(results.map(r => r.participant?.school).filter(Boolean))];
             const filteredResults = filterSchool === 'Semua' ? results : results.filter(r => r.participant?.school === filterSchool);
             const rankedResults = sortOlympiadResults(filteredResults);

             const handleSelectAll = (e) => { if (e.target.checked) setSelectedResults(rankedResults.map(r => r.id)); else setSelectedResults([]); };
             const handleSelectResult = (id) => { if (selectedResults.includes(id)) setSelectedResults(selectedResults.filter(rid => rid !== id)); else setSelectedResults([...selectedResults, id]); };

             const deleteResult = async (id) => {
                 showConfirm("Hapus hasil ujian peserta ini secara permanen?", async () => {
                     try { const db = await getSupabase(); await db.from('results').delete().eq('id', id); fetchSupabaseData(); showAlert("Data dihapus."); } catch(e) { showAlert(e.message); }
                 });
             };

             const handleDeleteSelected = async () => {
                 if (selectedResults.length === 0) return;
                 showConfirm(`Hapus permanen ${selectedResults.length} data ujian terpilih?`, async () => {
                     setIsDeleting(true);
                     try {
                         const db = await getSupabase();
                         const { error } = await db.from('results').delete().in('id', selectedResults);
                         if (error) throw error;
                         await fetchSupabaseData(); setSelectedResults([]); 
                         showAlert("Data terpilih berhasil dihapus.");
                     } catch (err) { showAlert(err.message); } finally { setIsDeleting(false); }
                 });
             };

             return (
               <AdminLayout title="Hasil & Penilaian Otomatis">
                 <div className="mb-6 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white p-5 rounded-3xl border shadow-sm">
                     <div className="flex flex-wrap items-center gap-4 w-full sm:w-auto">
                         <div className="flex items-center bg-slate-50 border border-slate-200 rounded-xl p-1">
                             <span className="text-[10px] font-black uppercase tracking-widest text-slate-500 pl-3">Asal Sekolah:</span>
                             <select value={filterSchool} onChange={e=>setFilterSchool(e.target.value)} className="w-full sm:w-auto p-2.5 text-[14px] font-bold bg-transparent outline-none cursor-pointer text-slate-800">
                                 {schoolList.map(s => <option key={s} value={s}>{s}</option>)}
                             </select>
                         </div>
                         
                         {selectedResults.length > 0 && (
                             <button onClick={handleDeleteSelected} disabled={isDeleting} className="bg-rose-100 text-rose-700 px-5 py-3 rounded-xl text-xs font-black uppercase tracking-wider flex items-center hover:bg-rose-200 transition-colors">
                                 <Trash2 size={14} className="mr-2"/> Hapus Terpilih ({selectedResults.length})
                             </button>
                         )}
                     </div>
                     <div className="flex gap-3 w-full sm:w-auto">
                         <button onClick={fetchSupabaseData} className="bg-white text-slate-600 border border-slate-200 px-4 py-3 rounded-xl text-[15px] font-bold flex items-center justify-center hover:bg-slate-50 transition-colors shadow-sm" title="Segarkan Data">
                             <i className="fas fa-sync-alt"></i>
                         </button>
                     </div>
                 </div>

                 {selectedAnalysis && (
                    <div className="fixed inset-0 modal-overlay z-[9999] flex items-center justify-center p-4 font-sans">
                        <div className="bg-white rounded-3xl shadow-2xl w-full max-w-6xl max-h-[90vh] flex flex-col overflow-hidden border-t-4 border-primary-600 animate-fade-in-up">
                            <div className="bg-primary-800 px-8 py-6 flex justify-between items-center relative overflow-hidden">
                                <div className="absolute right-0 top-0 opacity-10"><Database size={100}/></div>
                                <div className="relative z-10">
                                    <h3 className="font-black text-white text-[20px] uppercase tracking-widest mb-1">Lembar Koreksi Detail</h3>
                                    <p className="text-primary-200 font-bold text-[15px]">{selectedAnalysis.participant?.name} &bull; {selectedAnalysis.participant?.school}</p>
                                </div>
                                <button onClick={() => setSelectedAnalysis(null)} className="text-primary-300 hover:text-white bg-white/10 p-2.5 rounded-xl relative z-10 transition-colors"><X size={20}/></button>
                            </div>
                            <div className="p-0 overflow-y-auto flex-1 bg-slate-50">
                                <table className="w-full text-left text-sm border-collapse">
                                    <thead className="bg-white border-b-2 border-slate-200 sticky top-0 shadow-sm z-10">
                                        <tr>
                                            <th className="p-5 w-12 text-center text-[10px] font-black uppercase tracking-widest text-slate-400">No</th>
                                            <th className="p-5 text-[10px] font-black uppercase tracking-widest text-slate-400">Soal & Kunci Jawaban</th>
                                            <th className="p-5 w-80 text-[10px] font-black uppercase tracking-widest text-slate-400 border-l border-slate-200">Jawaban Peserta</th>
                                            <th className="p-5 w-32 text-center text-[10px] font-black uppercase tracking-widest text-slate-400 border-l border-slate-200">Perolehan Skor</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {questions.map((q, i) => {
                                            const details = selectedAnalysis.detail?.detailedResults || [];
                                            const d = details.find(x => x.qId === q.id);
                                            if (!d) return null;

                                            let ansDisplay = <span className="text-slate-400 italic font-medium text-[14px]">Kosong / Tidak Dijawab</span>;
                                            let keyDisplay = null;
                                            
                                            if (q.type === 'MCQ') {
                                                const correctOpt = q.options?.find(o => o.id === q.correctAnswer);
                                                const tmpK = document.createElement("div"); tmpK.innerHTML = correctOpt?.text || q.correctAnswer;
                                                keyDisplay = <div className="mt-4 p-3 bg-success/10 rounded-xl border border-success/20 text-[14px] text-slate-700 font-medium"><strong className="text-success-700 bg-success/20 px-2 py-0.5 rounded text-[10px] uppercase mr-2">{q.correctAnswer}</strong> {tmpK.textContent}</div>;
                                                
                                                if (!d.isEmpty && d.userAnswer) {
                                                    const opt = q.options?.find(o => o.id === d.userAnswer);
                                                    const tmp = document.createElement("div"); tmp.innerHTML = opt?.text || d.userAnswer;
                                                    ansDisplay = <div className="font-semibold text-slate-800 p-3 bg-white rounded-xl border border-slate-200 shadow-sm leading-relaxed"><strong className="text-primary-700 bg-primary-50 px-2 py-0.5 rounded text-[10px] mr-2">{d.userAnswer}</strong> {tmp.textContent}</div>;
                                                }
                                            } else if (q.type === 'SHORT') {
                                                keyDisplay = <div className="mt-4 p-3 bg-success/10 rounded-xl border border-success/20 text-[14px] text-slate-700 font-medium"><strong className="text-success-700 bg-success/20 px-2 py-0.5 rounded text-[10px] uppercase mr-2">Jawaban Valid:</strong> {q.correctAnswer}</div>;
                                                if (!d.isEmpty && d.userAnswer) { ansDisplay = <div className="font-semibold text-slate-800 p-3 bg-white rounded-xl border border-slate-200 shadow-sm">{d.userAnswer}</div>; }
                                            } else if (q.type === 'ESSAY') {
                                                keyDisplay = <div className="mt-4 p-3 bg-secondary/10 rounded-xl border border-secondary/20 text-[14px] text-slate-700 font-medium"><strong className="text-secondary-700 bg-secondary/20 px-2 py-0.5 rounded text-[10px] uppercase mr-2">Rubrik Penilaian:</strong> Penilaian manual oleh pendidik.</div>;
                                                if (!d.isEmpty && d.userAnswer) { ansDisplay = <div className="font-medium text-slate-700 p-4 bg-white rounded-xl border border-slate-200 shadow-sm whitespace-pre-wrap text-[14px] leading-relaxed">{d.userAnswer}</div>; }
                                            }

                                            const earned = d.pointsEarned || 0;
                                            const maxP = d.questionMaxPoints || 1;

                                            return (
                                                <tr key={q.id} className="border-b border-slate-200 bg-white font-sans">
                                                    <td className="p-6 text-center font-black text-slate-300 align-top text-[20px]">{i + 1}</td>
                                                    <td className="p-6 align-top">
                                                        <div className="flex items-center gap-2 mb-3">
                                                            <span className="text-[9px] font-black uppercase tracking-widest bg-slate-100 text-slate-500 px-2 py-1 rounded">{q.type}</span>
                                                            <span className={`text-[9px] font-black uppercase tracking-widest px-2 py-1 rounded ${q.difficulty==='Sulit'?'bg-rose-50 text-rose-600':q.difficulty==='Sedang'?'bg-primary-50 text-primary-600':'bg-success/10 text-success-700'}`}>{q.difficulty || 'Mudah'}</span>
                                                        </div>
                                                        <div className="text-slate-800 text-[16px] font-reading leading-[1.8] rich-text-content" dangerouslySetInnerHTML={{__html: q.question}} />
                                                        {keyDisplay}
                                                    </td>
                                                    <td className="p-6 align-top border-l border-slate-100 bg-slate-50/50">{ansDisplay}</td>
                                                    <td className="p-6 text-center align-top border-l border-slate-100">
                                                        <div className="flex flex-col items-center justify-center h-full">
                                                            <span className="font-black text-slate-800 text-[24px]">{earned}</span>
                                                            <span className="text-slate-400 font-bold text-[10px] uppercase tracking-widest mb-3">dari {maxP} pt</span>
                                                            {q.type === 'ESSAY' ? (
                                                                <span className="text-[9px] font-black px-3 py-1.5 rounded-lg uppercase tracking-widest bg-secondary/20 text-secondary-800">Tunda Koreksi</span>
                                                            ) : (
                                                                <span className={`text-[9px] font-black px-3 py-1.5 rounded-lg uppercase tracking-widest ${earned === maxP ? 'bg-success/20 text-success-800' : (earned > 0 ? 'bg-primary-100 text-primary-700' : 'bg-rose-100 text-rose-700')}`}>{earned === maxP ? 'BENAR' : (earned > 0 ? 'PARSIAL' : 'SALAH')}</span>
                                                            )}
                                                        </div>
                                                    </td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                 )}
                 
                 <div className="bg-white rounded-3xl border overflow-hidden shadow-sm">
                    <table className="w-full text-left text-[15px]">
                        <thead className="bg-slate-50">
                            <tr>
                                <th className="py-5 px-4 text-center w-12 border-b">
                                    <input type="checkbox" className="w-4 h-4 cursor-pointer accent-primary-600 rounded" onChange={handleSelectAll} checked={selectedResults.length > 0 && selectedResults.length === rankedResults.length} />
                                </th>
                                <th className="py-5 px-4 w-12 text-center text-[10px] font-black uppercase tracking-widest text-slate-400 border-b">Rnk</th>
                                <th className="py-5 px-4 text-[10px] font-black uppercase tracking-widest text-slate-400 border-b">Identitas Siswa</th>
                                <th className="py-5 px-4 text-center text-[10px] font-black uppercase tracking-widest text-slate-400 border-b" title="Skor Poin yang didapat">Skor Total</th>
                                <th className="py-5 px-4 text-center text-[10px] font-black uppercase tracking-widest text-slate-400 border-b" title="Indeks Talenta Olimpiade">ITO (Kategori)</th>
                                <th className="py-5 px-4 text-center text-[10px] font-black uppercase tracking-widest text-slate-400 border-b">Tindakan</th>
                            </tr>
                        </thead>
                        <tbody>
                            {rankedResults.map((r, idx)=> {
                                const s = r.detail?.stats || {};
                                const cat = getITOCategory(s.ito || 0);
                                return (
                                <tr key={r.id} className={`border-b border-slate-50 transition-colors ${selectedResults.includes(r.id) ? 'bg-primary-50/40' : 'bg-white hover:bg-slate-50'}`}>
                                    <td className="py-4 px-4 text-center">
                                        <input type="checkbox" className="w-4 h-4 cursor-pointer accent-primary-600 rounded" checked={selectedResults.includes(r.id)} onChange={() => handleSelectResult(r.id)} />
                                    </td>
                                    <td className="py-4 px-4 text-center">
                                        <div className={`w-8 h-8 rounded-full flex items-center justify-center font-black mx-auto text-[16px] ${idx < 3 ? 'bg-secondary/20 text-secondary-700' : 'bg-slate-100 text-slate-400'}`}>{idx + 1}</div>
                                    </td>
                                    <td className="py-4 px-4">
                                        <div className="font-black text-slate-800 uppercase tracking-wide text-[16px]">{r.participant?.name}</div>
                                        <div className="font-bold text-slate-500 text-[14px] mt-0.5">{r.participant?.school}</div>
                                    </td>
                                    <td className="py-4 px-4 text-center">
                                        <span className="font-black text-slate-800 text-[20px]">{r.score}</span>
                                    </td>
                                    <td className="py-4 px-4 text-center">
                                        <div className="font-black text-[18px] text-slate-800">{(s.ito||0).toFixed(1)}</div>
                                        <div className={`text-[9px] font-black uppercase tracking-wider px-2 py-0.5 rounded mt-1 inline-block ${cat.color} border`}>{cat.label}</div>
                                    </td>
                                    <td className="py-4 px-4 text-center">
                                        <div className="flex justify-center gap-2">
                                            <button onClick={() => setSelectedAnalysis(r)} className="text-primary-600 bg-primary-50 px-4 py-2 rounded-xl text-xs font-black uppercase tracking-wider hover:bg-primary-100 transition-colors shadow-sm">Koreksi</button>
                                            <button onClick={() => deleteResult(r.id)} className="text-slate-400 bg-slate-50 px-3 py-2 rounded-xl hover:text-rose-600 hover:bg-rose-50 transition-colors" title="Hapus Data"><Trash2 size={16}/></button>
                                        </div>
                                    </td>
                                </tr>
                            )})}
                            {rankedResults.length === 0 && <tr><td colSpan="6" className="text-center p-12 text-slate-400 font-bold text-[15px] uppercase tracking-widest bg-slate-50">Belum Ada Hasil Ujian Masuk</td></tr>}
                        </tbody>
                    </table>
                 </div>
               </AdminLayout>
             );
          };

          const AdminQuestions = () => {
            const [isSaving, setIsSaving] = useState(false);
            const [view, setViewLocal] = useState(window.savedAdminView || 'folders'); 
            const [filterFolder, setFilterFolderLocal] = useState(window.savedAdminFolder || 'Utama');
            const setView = (v) => { window.savedAdminView = v; setViewLocal(v); };
            const setFilterFolder = (f) => { window.savedAdminFolder = f; setFilterFolderLocal(f); };

            const defaultMCQ = { id: '', type: 'MCQ', difficulty: 'Mudah', folder: filterFolder, points: 1, question: '', options: [{id:'A', text:''}, {id:'B', text:''}, {id:'C', text:''}, {id:'D', text:''}], correctAnswer: 'A' };
            const defaultSHORT = { id: '', type: 'SHORT', difficulty: 'Mudah', folder: filterFolder, points: 1, question: '', correctAnswer: '' };
            const defaultESSAY = { id: '', type: 'ESSAY', difficulty: 'Mudah', folder: filterFolder, points: 1, question: '' };
            
            const [formData, setFormData] = useState(defaultMCQ);

            const saveQuestion = async (e) => {
               e.preventDefault(); setIsSaving(true);
               try {
                 const db = await getSupabase();
                 let payload = { id: formData.id || `q${Date.now()}`, type: formData.type, difficulty: formData.difficulty, folder: formData.folder || filterFolder, points: formData.points, question: formData.question };
                 if (formData.type === 'MCQ') { payload.options = formData.options; payload.correctAnswer = formData.correctAnswer; } 
                 else if (formData.type === 'SHORT') { payload.correctAnswer = formData.correctAnswer; }
                 
                 if(!formData.id) { const { error } = await db.from('questions').insert([payload]); if (error) throw error; } 
                 else { const { error } = await db.from('questions').update(payload).eq('id', payload.id); if (error) throw error; }
                 
                 setFilterFolder(payload.folder); setView('list'); await fetchSupabaseData(); 
                 showAlert("Soal berhasil disimpan ke dalam bank soal.");
               } catch (err) { showAlert("GAGAL MENYIMPAN KE DATABASE!\n" + err.message); } finally { setIsSaving(false); }
            };

            const deleteQuestion = async (id) => {
                showConfirm("Hapus soal dari bank soal secara permanen?", async () => {
                    try { const db = await getSupabase(); const { error } = await db.from('questions').delete().eq('id', id); if (error) throw error; setView('list'); await fetchSupabaseData(); showAlert("Soal terhapus."); } catch(e) { showAlert(e.message); }
                });
            };

            const duplicateQuestion = async (q) => {
                setIsSaving(true);
                try {
                    const db = await getSupabase(); const duplicatedQ = { ...q, id: `q${Date.now()}_copy` };
                    const { error } = await db.from('questions').insert([duplicatedQ]); if (error) throw error;
                    setFilterFolder(q.folder || filterFolder); setView('list'); await fetchSupabaseData(); 
                    showAlert("Duplikasi soal berhasil.");
                } catch(e) { showAlert(e.message); } setIsSaving(false);
            };

            const publishFolder = async (fname) => {
                try {
                    const db = await getSupabase();
                    const { data, error: checkErr } = await db.from('tokens').select('code').eq('code', 'SYS_SETTING_FOLDER').maybeSingle();
                    if (checkErr && checkErr.code !== 'PGRST116') throw checkErr;
                    if (data) { const { error } = await db.from('tokens').update({ status: fname }).eq('code', 'SYS_SETTING_FOLDER'); if (error) throw error; } 
                    else { const { error } = await db.from('tokens').insert([{ code: 'SYS_SETTING_FOLDER', status: fname, generatedAt: new Date().toISOString() }]); if (error) throw error; }
                    setActiveFolder(fname); showAlert(`Paket "${fname}" resmi digunakan untuk olimpiade!`);
                } catch(e) { showAlert("Gagal terbit: " + e.message); }
            };

            const folderStats = questions.reduce((acc, q) => { const f = q.folder || 'Utama'; acc[f] = (acc[f] || 0) + 1; return acc; }, {});
            tokens.forEach(t => { if (t.code && t.code.startsWith('SYS_FOLDER_') && folderStats[t.status] === undefined) { folderStats[t.status] = 0; } });
            if (folderStats['Utama'] === undefined) folderStats['Utama'] = 0;

            const createFolder = async () => {
                showPrompt("Ketikkan Nama Paket Soal Baru:", async (fname) => {
                    if (fname && fname.trim() !== '') {
                        setIsSaving(true);
                        try {
                            const db = await getSupabase();
                            const { error } = await db.from('tokens').insert([{ code: `SYS_FOLDER_${Date.now()}`, status: fname.trim(), generatedAt: new Date().toISOString(), participant_name: 'SYSTEM_FOLDER' }]);
                            if (error) throw error;
                            await fetchSupabaseData(); setFilterFolder(fname.trim()); setView('list');
                            showAlert("Paket baru berhasil dibuat.");
                        } catch(e) { showAlert(e.message); } setIsSaving(false);
                    }
                });
            };

            const editFolder = async (oldName) => {
                showPrompt(`Ubah nama "${oldName}" menjadi:`, async (newName) => {
                    if (newName && newName.trim() !== '' && newName.trim() !== oldName) {
                        setIsSaving(true);
                        try {
                            const db = await getSupabase();
                            const folderToken = tokens.find(t => t.code && t.code.startsWith('SYS_FOLDER_') && t.status === oldName);
                            if (folderToken) { const { error: err1 } = await db.from('tokens').update({ status: newName.trim() }).eq('code', folderToken.code); if (err1) throw err1; }
                            const { error: err2 } = await db.from('questions').update({ folder: newName.trim() }).eq('folder', oldName); if (err2) throw err2;
                            if (activeFolder === oldName) { const { error: err3 } = await db.from('tokens').update({ status: newName.trim() }).eq('code', 'SYS_SETTING_FOLDER'); if (err3) throw err3; setActiveFolder(newName.trim()); }
                            await fetchSupabaseData(); setFilterFolder(newName.trim());
                            showAlert("Nama paket berhasil diperbarui.");
                        } catch(e) { showAlert(e.message); } setIsSaving(false);
                    }
                }, oldName);
            };

            const deleteFolder = async (fname) => {
                if (fname === 'Utama') return showAlert("Folder Utama dilarang dihapus.");
                showConfirm(`Hapus permanen paket "${fname}" beserta seluruh isinya?`, async () => {
                    setIsSaving(true);
                    try {
                        const db = await getSupabase();
                        const folderToken = tokens.find(t => t.code && t.code.startsWith('SYS_FOLDER_') && t.status === fname);
                        if (folderToken) { const { error: err1 } = await db.from('tokens').delete().eq('code', folderToken.code); if (err1) throw err1; }
                        const { error: err2 } = await db.from('questions').delete().eq('folder', fname); if (err2) throw err2;
                        if (activeFolder === fname) { const { error: err3 } = await db.from('tokens').update({ status: 'Utama' }).eq('code', 'SYS_SETTING_FOLDER'); if (err3) throw err3; setActiveFolder('Utama'); }
                        await fetchSupabaseData(); setFilterFolder('Utama'); setView('folders');
                        showAlert("Paket dan isinya terhapus bersih.");
                    } catch(e) { showAlert(e.message); } setIsSaving(false);
                });
            };

            if (view === 'create' || view === 'edit') {
               const availableFolders = [...new Set([...questions.map(q => q.folder || 'Utama'), ...tokens.filter(t => t.code && t.code.startsWith('SYS_FOLDER_')).map(t => t.status), filterFolder, 'Utama'])];
               return (
                 <AdminLayout title="Authoring Soal Olimpiade">
                    <div className="bg-white rounded-3xl shadow-xl border border-slate-200 max-w-4xl mx-auto p-8 sm:p-10 mb-10 border-t-4 border-primary-800 relative overflow-hidden font-sans">
                        <div className="absolute top-0 right-0 p-10 opacity-5 pointer-events-none"><Edit size={120}/></div>
                        <h3 className="text-[20px] font-black text-slate-800 uppercase tracking-widest mb-8 border-b-2 border-slate-100 pb-4 relative z-10">Form Penyusunan Soal</h3>
                        <form onSubmit={saveQuestion} className="space-y-8 relative z-10">
                            
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6 bg-slate-50 p-6 rounded-2xl border border-slate-200">
                                <div>
                                    <label className="block text-[10px] font-black uppercase tracking-widest text-slate-500 mb-2">Tipe Komponen</label>
                                    <select value={formData.type} onChange={e => {
                                        const t = e.target.value;
                                        if(t === 'MCQ') setFormData({...defaultMCQ, difficulty: formData.difficulty, folder: formData.folder, question: formData.question});
                                        else if(t === 'SHORT') setFormData({...defaultSHORT, difficulty: formData.difficulty, folder: formData.folder, question: formData.question});
                                        else if(t === 'ESSAY') setFormData({...defaultESSAY, difficulty: formData.difficulty, folder: formData.folder, question: formData.question});
                                    }} className="w-full p-3.5 border-2 border-slate-200 rounded-xl bg-white text-[14px] font-bold focus:border-primary-500 outline-none transition-colors cursor-pointer text-slate-700">
                                        <option value="MCQ">Pilihan Ganda (A-D)</option>
                                        <option value="SHORT">Isian Singkat</option>
                                        <option value="ESSAY">Uraian / Essay</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-[10px] font-black uppercase tracking-widest text-slate-500 mb-2">Tingkat Kesulitan (Bobot)</label>
                                    <select value={formData.difficulty} onChange={e => setFormData({...formData, difficulty: e.target.value})} className="w-full p-3.5 border-2 border-slate-200 rounded-xl bg-white text-[14px] font-bold focus:border-primary-500 outline-none transition-colors cursor-pointer text-slate-700">
                                        <option value="Mudah">MUDAH (Bobot 1.00)</option>
                                        <option value="Sedang">SEDANG (Bobot 1.25)</option>
                                        <option value="Sulit">SULIT (Bobot 1.50)</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-[10px] font-black uppercase tracking-widest text-slate-500 mb-2">Paket Penempatan</label>
                                    <select value={formData.folder || filterFolder} onChange={e => setFormData({...formData, folder: e.target.value})} className="w-full p-3.5 border-2 border-slate-200 rounded-xl bg-white text-[14px] font-bold focus:border-primary-500 outline-none transition-colors cursor-pointer text-slate-700">
                                        {availableFolders.map(f => <option key={f} value={f}>{f}</option>)}
                                    </select>
                                </div>
                            </div>

                            <div>
                                <label className="block text-[14px] font-black text-slate-800 uppercase tracking-widest mb-3 flex items-center"><div className="w-6 h-6 bg-primary-800 text-white rounded flex items-center justify-center mr-2 text-xs">Q</div> Redaksi Pertanyaan</label>
                                <RichTextEditor value={formData.question} onChange={val => setFormData({...formData, question: val})} showPrompt={showPrompt} />
                            </div>

                            {formData.type === 'MCQ' && (
                                <div className="space-y-6 pt-6 border-t-2 border-slate-100">
                                    <h3 className="font-black text-slate-800 uppercase tracking-widest text-[14px] mb-4">Redaksi Opsi Jawaban</h3>
                                    {formData.options.map((opt, idx) => (
                                        <div key={opt.id} className="flex gap-4 items-start">
                                            <span className="font-black w-10 pt-3 text-[20px] text-slate-300 text-right">{opt.id}.</span>
                                            <div className="flex-1">
                                                <RichTextEditor minHeight="60px" value={opt.text} onChange={val => { const o = [...formData.options]; o[idx].text = val; setFormData({...formData, options: o}); }} showPrompt={showPrompt} />
                                            </div>
                                        </div>
                                    ))}
                                    <div className="bg-success/10 p-6 rounded-2xl border-2 border-success/20 mt-6 flex items-center justify-between shadow-inner">
                                        <label className="font-black uppercase tracking-widest text-success-800 text-[14px]"><CheckCircle size={18} className="inline mr-2"/> Kunci Benar:</label>
                                        <select value={formData.correctAnswer} onChange={e => setFormData({...formData, correctAnswer: e.target.value})} className="p-3 border-2 border-success-400 rounded-xl font-black text-success-700 text-[20px] w-32 text-center bg-white outline-none cursor-pointer focus:ring-4 focus:ring-success/20 transition-all"><option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option></select>
                                    </div>
                                </div>
                            )}

                            {formData.type === 'SHORT' && (
                                <div className="space-y-6 pt-6 border-t-2 border-slate-100">
                                    <h3 className="font-black text-slate-800 uppercase tracking-widest text-[14px] mb-4">Kunci Isian Singkat</h3>
                                    <div className="bg-primary-50 p-6 rounded-2xl border-2 border-primary-100">
                                        <label className="block text-xs font-bold text-primary-800 mb-3">Teks atau Angka Pasti (Sistem akan cek kecocokan huruf, tanpa membedakan besar-kecil)</label>
                                        <input type="text" value={formData.correctAnswer} onChange={e => setFormData({...formData, correctAnswer: e.target.value})} placeholder="Misal: 105 atau Jakarta" className="w-full p-4 border-2 border-primary-200 rounded-xl text-[20px] font-black text-primary-900 bg-white focus:border-primary-500 outline-none" required/>
                                    </div>
                                </div>
                            )}

                            {formData.type === 'ESSAY' && (
                                <div className="space-y-6 pt-6 border-t-2 border-slate-100">
                                    <div className="bg-secondary/10 p-6 rounded-2xl border-2 border-secondary/30 border-dashed text-center">
                                        <FileText size={40} className="mx-auto text-secondary-300 mb-3"/>
                                        <h3 className="font-black text-secondary-800 uppercase tracking-widest text-[14px] mb-1">Mode Soal Uraian</h3>
                                        <p className="text-secondary-700 text-xs font-semibold">Tipe soal ini memerlukan koreksi/penilaian rubrik manual oleh pendidik setelah ujian selesai.</p>
                                    </div>
                                </div>
                            )}

                            <div className="flex justify-end gap-4 pt-8 border-t-2 border-slate-100 mt-10 relative z-10">
                                <button type="button" onClick={() => setView('list')} className="px-8 py-4 border-2 border-slate-200 bg-white rounded-xl font-black text-slate-600 uppercase tracking-widest hover:bg-slate-50 transition-colors">Batal</button>
                                <button type="submit" disabled={isSaving} className="px-10 py-4 bg-primary-800 text-white rounded-xl font-black uppercase tracking-widest shadow-xl hover:bg-primary-900 transition-all disabled:opacity-50">{isSaving ? 'Menyimpan Data...' : 'Simpan Kedalam Bank'}</button>
                            </div>
                        </form>
                    </div>
                 </AdminLayout>
               );
            }

            if (view === 'list') {
              const folderQuestions = questions.filter(q => String(q.folder || 'Utama').trim().toLowerCase() === filterFolder.toLowerCase());
              return (
                <AdminLayout title={`Paket: ${filterFolder}`}>
                  <div className="mb-8 flex justify-between items-center bg-white p-5 rounded-3xl border border-slate-200 shadow-sm font-sans">
                     <button onClick={() => setView('folders')} className="border-2 border-slate-200 px-6 py-3 rounded-xl text-xs font-black uppercase tracking-widest flex items-center hover:bg-slate-50 text-slate-700 transition-colors"><ChevronLeft size={16} className="mr-2"/> Kembali</button>
                     <div className="text-right"><span className="text-[10px] font-black uppercase tracking-widest text-slate-400 block mb-1">Total Butir</span><span className="text-[20px] font-black text-slate-800">{folderQuestions.length}</span></div>
                  </div>
                  
                  <div className="space-y-6">
                    {folderQuestions.map((q, idx) => (
                       <div key={q.id} className="bg-white p-6 sm:p-8 rounded-3xl border border-slate-200 shadow-sm flex flex-col sm:flex-row justify-between items-start gap-6 hover:border-primary-300 transition-all group font-sans">
                         <div className="flex-1 w-full overflow-hidden">
                             <div className="flex flex-wrap items-center gap-2 mb-4">
                                 <span className="text-xs font-black bg-primary-800 text-white px-3 py-1.5 rounded-lg tracking-wider">NO. {idx+1}</span>
                                 <span className="text-[10px] font-black bg-slate-100 text-slate-500 px-3 py-1.5 rounded uppercase tracking-widest border border-slate-200">{q.type}</span>
                                 <span className={`text-[10px] font-black px-3 py-1.5 rounded uppercase tracking-widest ${q.difficulty==='Sulit'?'bg-rose-100 text-rose-700':q.difficulty==='Sedang'?'bg-primary-100 text-primary-700':'bg-success/20 text-success-800'}`}>{q.difficulty || 'Mudah'}</span>
                             </div>
                             <div className="mt-2 text-slate-800 font-reading text-[16px] leading-[1.8] rich-text-content" dangerouslySetInnerHTML={{__html: q.question}}></div>
                         </div>
                         <div className="flex sm:flex-col gap-3 shrink-0 w-full sm:w-auto border-t sm:border-t-0 sm:border-l border-slate-100 pt-4 sm:pt-0 sm:pl-6">
                            <button onClick={() => duplicateQuestion(q)} className="bg-slate-50 text-slate-600 hover:bg-slate-100 p-3 rounded-xl font-black text-[10px] uppercase tracking-widest flex items-center justify-center border border-slate-200 flex-1 sm:flex-none transition-colors"><Copy size={16} className="sm:mr-2"/> <span className="hidden sm:inline">Gandakan</span></button>
                            <button onClick={() => {setFormData(q); setView('edit');}} className="text-primary-600 bg-primary-50 border border-primary-100 p-3 hover:bg-primary-100 rounded-xl flex items-center justify-center transition-colors" title="Edit Soal"><Edit size={18}/></button>
                            <button onClick={() => deleteQuestion(q.id)} className="text-rose-600 bg-rose-50 border border-rose-100 p-3 hover:bg-rose-100 rounded-xl flex items-center justify-center transition-colors" title="Hapus Soal"><Trash2 size={18}/></button>
                         </div>
                       </div>
                    ))}
                    {folderQuestions.length === 0 && <div className="text-center py-20 bg-white rounded-3xl border-2 border-dashed border-slate-300 font-sans"><FileText size={60} className="mx-auto mb-5 text-slate-200"/><h3 className="text-[20px] font-black text-slate-400 uppercase tracking-widest">Kosong</h3><p className="text-[14px] font-bold text-slate-400 mt-2">Gunakan tombol + untuk menambah data soal</p></div>}
                  </div>
                  <button onClick={() => {setFormData({...defaultMCQ, folder: filterFolder}); setView('create');}} className="fixed bottom-8 right-8 bg-secondary text-white w-16 h-16 rounded-2xl flex items-center justify-center shadow-xl hover:-translate-y-2 hover:shadow-2xl transition-all z-40"><Plus size={32}/></button>
                </AdminLayout>
              );
            }

            return (
              <AdminLayout title="Manajemen Paket Soal">
                 <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 font-sans">
                    <div onClick={createFolder} className="bg-white border-2 border-dashed border-slate-300 rounded-3xl p-8 flex flex-col items-center justify-center cursor-pointer min-h-[220px] hover:border-primary-400 hover:bg-primary-50/50 transition-colors group">
                        <div className="w-16 h-16 bg-slate-100 text-slate-400 group-hover:bg-primary-100 group-hover:text-primary-600 rounded-2xl flex items-center justify-center mb-5 transition-colors"><Plus size={32}/></div>
                        <span className="font-black text-slate-600 group-hover:text-primary-700 text-[14px] uppercase tracking-widest">Buat Paket Baru</span>
                    </div>
                    {Object.entries(folderStats).map(([fname, count]) => {
                        const isPublished = activeFolder.toLowerCase() === fname.toLowerCase();
                        return (
                        <div key={fname} className={`bg-white border-2 rounded-3xl p-8 flex flex-col justify-between shadow-sm min-h-[220px] relative overflow-hidden transition-all hover:shadow-md ${isPublished ? 'border-secondary ring-4 ring-secondary/10' : 'border-slate-200'}`}>
                            {isPublished && <div className="absolute top-0 right-0 bg-secondary text-white text-[9px] font-black px-4 py-1.5 rounded-bl-xl uppercase tracking-widest shadow-sm">AKTIF</div>}
                            <div className="pt-2">
                                <h4 className="font-black text-[24px] text-slate-800 mb-3 truncate" title={fname}>{fname}</h4>
                                <div className="text-[10px] text-slate-500 font-black uppercase tracking-widest bg-slate-100 inline-block px-3 py-1.5 rounded-md border border-slate-200"><Database size={12} className="inline mr-1 text-slate-400"/> {count} Komponen Soal</div>
                            </div>
                            <div className="mt-8 flex flex-col gap-3">
                                <div className="flex gap-2">
                                    <button onClick={() => { setFilterFolder(fname); setView('list'); }} className="flex-1 bg-primary-800 py-3 rounded-xl text-xs font-black uppercase tracking-widest text-white hover:bg-primary-900 transition-colors">Buka Editor</button>
                                    <button onClick={() => editFolder(fname)} className="px-4 bg-white border border-slate-200 text-slate-600 rounded-xl hover:bg-slate-50 transition-colors" title="Ubah Nama"><Edit size={16}/></button>
                                    {fname !== 'Utama' && <button onClick={() => deleteFolder(fname)} className="px-4 bg-white border border-slate-200 text-rose-500 rounded-xl hover:bg-rose-50 transition-colors" title="Hapus"><Trash2 size={16}/></button>}
                                </div>
                                <button onClick={() => publishFolder(fname)} className={`w-full py-3.5 rounded-xl text-xs font-black uppercase tracking-widest transition-all ${isPublished ? 'bg-secondary/20 text-secondary-800 border border-secondary/30' : 'bg-white border-2 border-slate-200 text-slate-600 hover:bg-slate-50 hover:border-slate-300'}`}>
                                    {isPublished ? 'DITERBITKAN KE PESERTA' : 'Terbitkan Sekarang'}
                                </button>
                            </div>
                        </div>
                    )})}
                 </div>
              </AdminLayout>
            );
          };

          const AdminItemAnalysis = () => {
             const [isDeleting, setIsDeleting] = useState(false);
             const [filterFolder, setFilterFolder] = useState('Semua');

             const availableFolders = ['Semua', ...new Set(questions.map(q => q.folder || 'Utama'))];
             const filteredQuestions = filterFolder === 'Semua' ? questions : questions.filter(q => (q.folder || 'Utama') === filterFolder);

             const deleteAllResults = async () => {
                if(results.length === 0) return;
                showConfirm("Menghapus data di sini akan mereset SELURUH hasil peserta. Lanjutkan?", async () => {
                    setIsDeleting(true);
                    try {
                        const db = await getSupabase();
                        const { error } = await db.from('results').delete().neq('participant_name', 'DELETE_ALL_DUMMY');
                        if (error) throw error;
                        await fetchSupabaseData();
                        showAlert("Seluruh data hasil peserta berhasil dikosongkan.");
                    } catch(e) { showAlert(e.message); }
                    setIsDeleting(false);
                });
             };

             const rankedResults = sortOlympiadResults(results);
             const N = rankedResults.length;
             let groupSize = Math.max(1, Math.floor(N * 0.27));
             if (N < 10) groupSize = Math.floor(N / 2);
             
             const upperGroup = rankedResults.slice(0, groupSize);
             const lowerGroup = rankedResults.slice(N - groupSize);

            const analysisData = filteredQuestions.map(q => {
                let correct = 0, wrong = 0, empty = 0;
                let correctUG = 0; let correctLG = 0;

                results.forEach(r => {
                    const details = r.detail?.detailedResults || [];
                    const d = details.find(x => x.qId === q.id);
                    if (!d || d.isEmpty) empty++; else if (d.isCorrect) correct++; else wrong++;
                });

                upperGroup.forEach(r => { const details = r.detail?.detailedResults || []; const d = details.find(x => x.qId === q.id); if (d && d.isCorrect) correctUG++; });
                lowerGroup.forEach(r => { const details = r.detail?.detailedResults || []; const d = details.find(x => x.qId === q.id); if (d && d.isCorrect) correctLG++; });

                const total = results.length;
                const p = total > 0 ? (correct / total) : 0;
                const percentage = (p * 100).toFixed(1);
                const pSalah = total > 0 ? ((wrong / total) * 100).toFixed(1) : 0;

                const dpRaw = groupSize > 0 ? (correctUG - correctLG) / groupSize : 0;
                let dpLabel = "N/A"; let dpColor = "text-slate-400";
                if(groupSize > 0) {
                    if (dpRaw >= 0.4) { dpLabel = "Sangat Baik"; dpColor = "text-success-600"; }
                    else if (dpRaw >= 0.3) { dpLabel = "Baik"; dpColor = "text-primary-600"; }
                    else if (dpRaw >= 0.2) { dpLabel = "Cukup"; dpColor = "text-secondary-600"; }
                    else { dpLabel = "Buruk"; dpColor = "text-rose-600"; }
                }
                
                let difficulty = "N/A";
                if (total > 0) {
                    if (p > 0.85) difficulty = "Sangat Mudah";
                    else if (p >= 0.70) difficulty = "Mudah";
                    else if (p >= 0.30) difficulty = "Sedang";
                    else if (p >= 0.15) difficulty = "Sulit";
                    else difficulty = "Sangat Sulit";
                }
                return { ...q, correct, wrong, empty, total, percentage, pSalah, difficulty, dpRaw: dpRaw.toFixed(2), dpLabel, dpColor };
            });

            return (
              <AdminLayout title="Validasi & Analisis Butir">
                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 gap-5 font-sans">
                    <div className="bg-white rounded-2xl border border-slate-200 p-5 flex-1 w-full sm:w-auto shadow-sm flex flex-col sm:flex-row gap-5 items-start sm:items-center">
                       <div>
                           <h3 className="font-black text-slate-500 uppercase tracking-widest text-[10px] mb-2">Pilih Filter Paket</h3>
                           <select value={filterFolder} onChange={e=>setFilterFolder(e.target.value)} className="border-2 border-slate-200 rounded-xl p-3 text-[14px] font-bold focus:border-primary-500 outline-none cursor-pointer bg-slate-50 text-slate-700">
                               {availableFolders.map(f => <option key={f} value={f}>{f}</option>)}
                           </select>
                       </div>
                       <div className="sm:ml-auto text-left sm:text-right border-l-0 sm:border-l border-slate-100 sm:pl-6 pt-4 sm:pt-0 border-t sm:border-t-0 mt-2 sm:mt-0">
                           <p className="text-slate-400 text-[10px] font-black uppercase tracking-widest mb-1">Total Populasi Data</p>
                           <p className="text-primary-800 text-[24px] font-black">{results.length} <span className="text-[14px] font-bold text-slate-400 uppercase">Siswa</span></p>
                       </div>
                    </div>
                    <div className="flex flex-wrap gap-3 w-full sm:w-auto">
                        <button onClick={fetchSupabaseData} className="flex-1 sm:flex-none bg-white text-slate-600 border-2 border-slate-200 px-5 py-4 rounded-2xl text-[14px] font-bold flex items-center justify-center hover:bg-slate-50 transition-colors shadow-sm">
                           <i className="fas fa-sync-alt"></i>
                        </button>
                        <button onClick={deleteAllResults} disabled={isDeleting || results.length === 0} className="w-full sm:w-auto bg-rose-50 text-rose-600 border border-rose-200 px-6 py-4 rounded-2xl text-xs font-black uppercase tracking-widest hover:bg-rose-100 disabled:opacity-50 transition-colors shadow-sm">
                            Kosongkan Hasil
                        </button>
                    </div>
                </div>
                
                <div className="bg-white rounded-3xl border border-slate-200 overflow-hidden shadow-sm font-sans">
                    <div className="overflow-x-auto">
                        <table className="w-full text-left text-[14px] whitespace-nowrap">
                            <thead className="bg-slate-50 border-b border-slate-200">
                                <tr>
                                    <th className="p-5 text-center w-12 text-[10px] font-black uppercase tracking-widest text-slate-400">ID</th>
                                    <th className="p-5 text-[10px] font-black uppercase tracking-widest text-slate-400">Kategori Soal</th>
                                    <th className="p-5 text-center text-[10px] font-black uppercase tracking-widest text-slate-400">Pola Jawab (B/S/K)</th>
                                    <th className="p-5 text-center text-[10px] font-black uppercase tracking-widest text-slate-400">% Benar / Salah</th>
                                    <th className="p-5 text-center text-[10px] font-black uppercase tracking-widest text-slate-400">Tingkat Kesukaran (P)</th>
                                    <th className="p-5 text-center text-[10px] font-black uppercase tracking-widest text-slate-400">Daya Pembeda (DP)</th>
                                </tr>
                            </thead>
                            <tbody>
                                {analysisData.map((d, idx) => {
                                    return (
                                    <tr key={d.id} className="border-b border-slate-50 hover:bg-slate-50 transition-colors">
                                        <td className="p-5 text-center font-black text-slate-400">{idx + 1}</td>
                                        <td className="p-5">
                                            <div className="flex items-center gap-2 mb-1.5">
                                                <span className="text-[9px] font-black uppercase tracking-widest text-slate-500 bg-slate-100 px-2 py-0.5 rounded border border-slate-200">{d.type}</span>
                                                <span className={`text-[9px] font-black uppercase tracking-widest px-2 py-0.5 rounded border ${d.difficulty.includes('Sulit')?'bg-rose-50 text-rose-600 border-rose-100':d.difficulty==='Sedang'?'bg-primary-50 text-primary-600 border-primary-100':'bg-success/10 text-success-700 border-success/20'}`}>{d.difficulty}</span>
                                            </div>
                                        </td>
                                        <td className="p-5 text-center">
                                            <div className="flex items-center justify-center gap-1.5 font-black text-[14px]">
                                                <span className="text-success-700 bg-success/20 px-2 py-1 rounded w-8" title="Jumlah Benar">{d.correct}</span>
                                                <span className="text-rose-600 bg-rose-50 px-2 py-1 rounded w-8" title="Jumlah Salah">{d.wrong}</span>
                                                <span className="text-slate-500 bg-slate-100 px-2 py-1 rounded w-8" title="Tidak Dijawab">{d.empty}</span>
                                            </div>
                                        </td>
                                        <td className="p-5 text-center">
                                            <div className="font-black text-[16px] text-success-600 mb-0.5">{d.percentage}% <span className="text-[9px] text-slate-400 uppercase tracking-widest">Benar</span></div>
                                            <div className="font-black text-[16px] text-rose-600">{d.pSalah}% <span className="text-[9px] text-slate-400 uppercase tracking-widest">Salah</span></div>
                                        </td>
                                        <td className="p-5 text-center">
                                            <div className={`text-[10px] uppercase tracking-wider font-bold px-3 py-1 rounded border inline-block shadow-sm ${d.difficulty.includes('Mudah') ? 'bg-success/10 text-success-700 border-success/20' : d.difficulty === 'Sedang' ? 'bg-primary-50 text-primary-600 border-primary-100' : 'bg-rose-50 text-rose-600 border-rose-100'}`}>{d.difficulty}</div>
                                        </td>
                                        <td className="p-5 text-center">
                                            <div className={`font-black text-[18px] mb-0.5 ${d.dpColor}`}>{d.dpRaw}</div>
                                            <div className={`text-[9px] uppercase tracking-wider font-bold ${d.dpColor}`}>{d.dpLabel}</div>
                                        </td>
                                    </tr>
                                )})}
                                {analysisData.length === 0 && <tr><td colSpan="6" className="text-center p-16 text-slate-400 font-bold uppercase tracking-widest text-[14px] bg-slate-50">Belum ada instrumen soal.</td></tr>}
                            </tbody>
                        </table>
                    </div>
                </div>
              </AdminLayout>
            );
          };

          const AdminReports = () => {
             const [filterSchool, setFilterSchool] = useState('Semua');
             
             const schoolList = ['Semua', ...new Set(results.map(r => r.participant?.school).filter(Boolean))];
