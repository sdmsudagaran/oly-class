        const RichTextEditor = ({ value, onChange, placeholder, minHeight="120px", showPrompt }) => {
            const editorRef = useRef(null);
            const fileInputRef = useRef(null);

            useEffect(() => {
                if (editorRef.current && value !== editorRef.current.innerHTML) editorRef.current.innerHTML = value || '';
                try {
                    document.execCommand('defaultParagraphSeparator', false, 'p');
                    document.execCommand('styleWithCSS', false, true);
                } catch(e) {}
            }, []); 

            const handleInput = () => { if (editorRef.current) onChange(editorRef.current.innerHTML); };
            
            const execCmd = (cmd, e, val=null) => { 
                if(e) e.preventDefault(); 
                editorRef.current.focus(); 
                document.execCommand(cmd, false, val); 
                handleInput(); 
            };

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        const imgHTML = `<img src="${reader.result}" alt="Gambar" style="max-width: 100%; width: auto; max-height: 250px; border-radius: 8px; margin: 8px 0; object-fit: contain; display: block;" /><br/>`;
                        editorRef.current.focus();
                        document.execCommand('insertHTML', false, imgHTML);
                        handleInput();
                    };
                    reader.readAsDataURL(file);
                }
            };

            const insertMath = (formula) => {
                const mathHTML = ` <span class="math-tex">\\(${formula}\\)</span> `;
                editorRef.current.focus();
                document.execCommand('insertHTML', false, mathHTML);
                handleInput();
            };

            const insertMathManual = (e) => {
                if(e) e.preventDefault();
                if(showPrompt) {
                    showPrompt("Ketik manual kode LaTeX (contoh: \\frac{1}{2}):", (formula) => {

            };

            return (

                        <button onMouseDown={(e)=>execCmd('justifyRight', e)} type="button" className="w-8 h-8 text-slate-700 hover:bg-slate-200 rounded flex items-center justify-center" title="Rata Kanan"><i className="fas fa-align-right text-xs"></i></button>

                        <button onMouseDown={insertMathManual} type="button" className="h-8 px-2 text-slate-700 hover:bg-slate-200 rounded flex items-center text-xs font-semibold" title="Ketik Manual LaTeX"><Calculator size={14} className="mr-1 text-primary-600"/> Manual</button>

        function useStickySession(defaultValue, key) {

        /* --- OLIMPIADE CORE LOGIC --- */
        const sortOlympiadResults = (resultsArray) => {
            return [...resultsArray].sort((a, b) => {
                // 1. Prioritas Utama: Nilai Total Peserta (Skor Akhir Tertinggi)
                if (b.score !== a.score) return b.score - a.score;
                
                // --- TIE BREAK RANKING ---
                const statsA = a.detail?.stats || {};
                const statsB = b.detail?.stats || {};
                
                // 2. Jumlah Benar Soal Sulit
                if ((statsB.correctSulit||0) !== (statsA.correctSulit||0)) return (statsB.correctSulit||0) - (statsA.correctSulit||0);
                
                // 3. Jumlah Benar Soal Sedang
                if ((statsB.correctSedang||0) !== (statsA.correctSedang||0)) return (statsB.correctSedang||0) - (statsA.correctSedang||0);
                
                // 4. Jumlah Benar Soal Mudah
                if ((statsB.correctMudah||0) !== (statsA.correctMudah||0)) return (statsB.correctMudah||0) - (statsA.correctMudah||0);
                
                // 5. Waktu Selesai Tercepat
                const timeA = a.endTime - a.startTime;
                const timeB = b.endTime - b.startTime;
                return timeA - timeB;
            });
        };

        const getITOCategory = (ito) => {
            if (ito >= 90) return { label: 'Kandidat Nasional', color: 'bg-primary-100 text-primary-800 border-primary-300' };
            if (ito >= 80) return { label: 'Kandidat Provinsi', color: 'bg-blue-100 text-blue-800 border-blue-300' };
            if (ito >= 70) return { label: 'Kandidat Kabupaten', color: 'bg-success/20 text-success-800 border-success/30' };
            if (ito >= 60) return { label: 'Potensial Dibina', color: 'bg-secondary/20 text-secondary-800 border-secondary/30' };
            return { label: 'Perlu Pendampingan', color: 'bg-rose-100 text-rose-800 border-rose-300' };
        };

        const calculateScore = (answers, questions) => {
          let totalPoints = 0;
          let maxPossiblePoints = 0;
          
          let correctMudah = 0, totalMudah = 0;
          let correctSedang = 0, totalSedang = 0;
          let correctSulit = 0, totalSulit = 0;
          
          const detailedResults = questions.map(q => {
            const userAnswer = answers[q.id];
            let isCorrect = false;
            let pointsEarned = 0;
            
            // Pengecekan Bobot Kesulitan
            const diff = q.difficulty || 'Mudah';
            let weight = 1.00;
            if (diff === 'Sedang') weight = 1.25;
            if (diff === 'Sulit') weight = 1.50;

            // Kalkulasi Total Populasi Tingkat Kesulitan
            if (diff === 'Sulit') totalSulit++;
            else if (diff === 'Sedang') totalSedang++;
            else totalMudah++;
            
            // Evaluasi Kebenaran
            if (q.type === 'MCQ') {
                if (userAnswer && userAnswer === q.correctAnswer) isCorrect = true;
            } else if (q.type === 'SHORT') {
                if (userAnswer && String(userAnswer).trim().toLowerCase() === String(q.correctAnswer).trim().toLowerCase()) isCorrect = true;
            } else if (q.type === 'ESSAY') {
                isCorrect = false; // Penilaian Rubrik Manual
            }
            
            // Distribusi Poin Sesuai Pedoman Penskoran
            if (isCorrect) {
                pointsEarned = weight; // Jika jawaban benar = Poin Sesuai Bobot
                if (diff === 'Sulit') correctSulit++;
                else if (diff === 'Sedang') correctSedang++;
                else correctMudah++;
            } else {
                pointsEarned = 0; // Jika salah / kosong = Poin 0
            }
            
            maxPossiblePoints += weight;
            totalPoints += pointsEarned;
            
            const isEmpty = !userAnswer || (typeof userAnswer === 'string' && userAnswer.trim() === '');
            
            return { 
                qId: q.id, type: q.type, difficulty: diff, isCorrect, isEmpty,
                pointsEarned, questionMaxPoints: weight, userAnswer: userAnswer
            };
          });
          
          // Formula Indeks Talenta Olimpiade (ITO)
          const pMudah = totalMudah > 0 ? (correctMudah / totalMudah) * 100 : 0;
          const pSedang = totalSedang > 0 ? (correctSedang / totalSedang) * 100 : 0;
          const pSulit = totalSulit > 0 ? (correctSulit / totalSulit) * 100 : 0;
          const ito = (0.50 * pSulit) + (0.30 * pSedang) + (0.20 * pMudah);
          
          return { 
              finalScore: Number(totalPoints.toFixed(2)), 
              maxPossiblePoints: Number(maxPossiblePoints.toFixed(2)), 
              ito: Number(ito.toFixed(2)),
              correctMudah, correctSedang, correctSulit, 
              totalMudah, totalSedang, totalSulit,
              pMudah: Number(pMudah.toFixed(2)), pSedang: Number(pSedang.toFixed(2)), pSulit: Number(pSulit.toFixed(2)),
              detailedResults 
          };
        };

        function App() {
          const [currentRoute, setCurrentRoute] = useState('/'); 
          const [tokens, setTokens] = useState([]);
          const [results, setResults] = useState([]);
          const [questions, setQuestions] = useState([]);
          
          const [activeFolder, setActiveFolder] = useState('Utama');
          const [organizerName, setOrganizerName] = useState('Dinas Pendidikan Daerah');
          const [schoolLogo, setSchoolLogo] = useState('');
          const [examDate, setExamDate] = useState('');
          const [startTimeStr, setStartTimeStr] = useState('07:30');
          const [endTimeStr, setEndTimeStr] = useState('12:00');
          const [isRandomQ, setIsRandomQ] = useState(false);
          const [isRandomOpt, setIsRandomOpt] = useState(false);

          const [isLoadingData, setIsLoadingData] = useState(false);
          const [dbStatus, setDbStatus] = useState('connecting');
          const [initErrorMsg, setInitErrorMsg] = useState('');
          
          const [activeSession, setActiveSession] = useStickySession(null, 'cbt_active_session');
          const [isAdminLoggedIn, setIsAdminLoggedIn] = useStickySession(false, 'cbt_admin_auth');
          const [studentResultPayload, setStudentResultPayload] = useStickySession(null, 'cbt_student_result');
          
          // State Dialog Konfirmasi Kustom (Menggantikan Alert/Prompt bawaan browser)
          const [dialog, setDialog] = useState(null);

          const showAlert = useCallback((msg, onConfirm) => setDialog({ type: 'alert', msg, onConfirm }), []);
          const showConfirm = useCallback((msg, onConfirm, onCancel) => setDialog({ type: 'confirm', msg, onConfirm, onCancel }), []);
          const showPrompt = useCallback((msg, onConfirm, defaultValue = '') => setDialog({ type: 'prompt', msg, onConfirm, defaultValue }), []);

          const navigate = (path) => { window.scrollTo(0,0); setCurrentRoute(path); };

          const fetchSupabaseData = async () => {
             setIsLoadingData(true);
             try {
                const db = await getSupabase();
                const [qRes, tRes] = await Promise.all([
                    db.from('questions').select('*'),
                    db.from('tokens').select('*').order('generatedAt', { ascending: false })
                ]);
                
                if(qRes.error) throw qRes.error;
                if(tRes.error) throw tRes.error;
                
                if(qRes.data) setQuestions(qRes.data);
                if(tRes.data) {
                    setTokens(tRes.data);
                    const extractSetting = (code, setFn, isBool = false) => {
                        const t = tRes.data.find(x => x.code === code);
                        if (t) setFn(isBool ? t.status === 'TRUE' : t.status);
                    };
                    extractSetting('SYS_SETTING_FOLDER', setActiveFolder);
                    extractSetting('SYS_SETTING_ORGANIZER', setOrganizerName);
                    extractSetting('SYS_SETTING_LOGO', setSchoolLogo);
                    extractSetting('SYS_SETTING_DATE', setExamDate);
                    extractSetting('SYS_SETTING_START_TIME', setStartTimeStr);
                    extractSetting('SYS_SETTING_END_TIME', setEndTimeStr);
                    extractSetting('SYS_SETTING_RANDOM_Q', setIsRandomQ, true);
                    extractSetting('SYS_SETTING_RANDOM_OPT', setIsRandomOpt, true);
                }

                const rRes = await db.from('results').select('*').order('created_at', { ascending: false });
                if(rRes.error) throw rRes.error;
                if(rRes.data) {
                    const formattedResults = rRes.data.map(r => {
                        const parsedDetail = typeof r.detailed_results === 'string' ? JSON.parse(r.detailed_results) : r.detailed_results;
                        const isNewFormat = parsedDetail && parsedDetail.stats !== undefined;
                        return {
                            id: r.id, participant: { name: r.participant_name, school: r.participant_school, nis: r.participant_nis, grade: r.participant_grade },
                            token: r.token, score: Number(r.score).toFixed(2), startTime: parseInt(r.start_time), endTime: parseInt(r.end_time),
                            detail: { detailedResults: isNewFormat ? parsedDetail.details : parsedDetail, stats: isNewFormat ? parsedDetail.stats : { ito: 0, correctMudah: 0, correctSedang: 0, correctSulit: 0, pMudah: 0, pSedang: 0, pSulit: 0 } }, 
                            created_at: r.created_at
                        };
                    });
                    setResults(formattedResults);
                }
                setDbStatus('connected'); setInitErrorMsg('');
             } catch (error) { setInitErrorMsg(error.message); setDbStatus('error'); } 
             finally { setIsLoadingData(false); }
          };

          useEffect(() => { fetchSupabaseData(); }, [isAdminLoggedIn, currentRoute]);

          const activeQuestions = questions.filter(q => String(q.folder || 'Utama').trim().toLowerCase() === String(activeFolder || 'Utama').trim().toLowerCase());

          useEffect(() => {
            if (currentRoute === '/') {
              if (activeSession && activeSession.status === 'ACTIVE') navigate('/exam');
              else navigate('/login');
            }
            triggerMathRender();
          }, [currentRoute, activeSession]);

          const ParticipantLogin = () => {
            const [inputToken, setInputToken] = useState('');
            const [error, setError] = useState('');
            const [isChecking, setIsChecking] = useState(false);

            const handleLogin = async (e) => {
              e.preventDefault();
              setIsChecking(true); setError('');
              try {
                const db = await getSupabase();
                const { data: tokenObj, error: fetchErr } = await db.from('tokens').select('*').eq('code', inputToken.trim().toUpperCase()).single();
                
                if (fetchErr || !tokenObj || tokenObj.code.startsWith('SYS_SETTING_') || tokenObj.code.startsWith('SYS_FOLDER_')) { setError('Token tidak valid atau tidak ditemukan.'); setIsChecking(false); return; }
                if (tokenObj.status === 'USED') { setError('Token sudah digunakan.'); setIsChecking(false); return; }
                if (tokenObj.status === 'EXPIRED') { setError('Token kedaluwarsa.'); setIsChecking(false); return; }
                if (tokenObj.status === 'BLOCKED') { setError('Token diblokir. Hubungi administrator.'); setIsChecking(false); return; }

                if (examDate && startTimeStr && endTimeStr) {
                    const now = new Date();
                    const startDateTime = new Date(`${examDate}T${startTimeStr}:00`);
                    const endDateTime = new Date(`${examDate}T${endTimeStr}:00`);
                    if (now < startDateTime) { setError(`Ujian belum dimulai. Jadwal: ${examDate} pukul ${startTimeStr}`); setIsChecking(false); return; }
                    if (now > endDateTime) { setError(`Waktu ujian telah berakhir pada ${examDate} pukul ${endTimeStr}`); setIsChecking(false); return; }
                }

                setActiveSession({ token: tokenObj.code, participant: { name: tokenObj.participant_name || 'Peserta', school: tokenObj.participant_school || organizerName, nis: '', grade: '6' }, answers: {}, flagged: [], status: 'SETUP' });
                navigate('/instruction');
              } catch (err) { setError(err.message || 'Gagal terhubung ke server.'); }
              setIsChecking(false);
            };

            return (
              <div className="min-h-screen bg-background flex flex-col justify-center items-center p-4 font-sans">
                <div className="max-w-md w-full bg-white rounded-3xl shadow-xl p-8 border-t-4 border-primary-700 relative overflow-hidden">
                  <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-primary-400 via-secondary to-success"></div>
                  <div className="text-center mb-8 mt-2">
                    <div className="w-20 h-20 bg-primary-50 text-primary-700 rounded-2xl flex items-center justify-center mx-auto mb-5 shadow-sm overflow-hidden border border-primary-100">
                        {schoolLogo ? <img src={schoolLogo} alt="Logo" className="w-full h-full object-cover"/> : <Medal size={40} />}
                    </div>
                    <h1 className="text-[24px] md:text-[32px] font-bold text-primary-800 tracking-tight">Kelas Olimpiade</h1>
                    <p className="text-slate-500 font-semibold mt-1 text-[16px] md:text-[18px]">{organizerName}</p>
                  </div>
                  
                  {initErrorMsg && (
                      <div className="mb-6 p-4 bg-rose-50 text-rose-600 rounded-xl text-sm border border-rose-200 font-medium flex items-start">
                          <AlertCircle size={18} className="mr-2 mt-0.5 flex-shrink-0"/>
                          <div><p className="font-bold mb-1">Koneksi Database Terputus</p><p>{initErrorMsg}</p></div>
                      </div>
                  )}

                  <form onSubmit={handleLogin} className="space-y-5">
                    <div>
                      <label className="block text-[14px] font-bold text-slate-700 mb-2">Token Peserta</label>
                      <div className="relative">
                        <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none"><Key className="h-5 w-5 text-slate-400" /></div>
                        <input type="text" className="block w-full pl-11 pr-4 py-3.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 uppercase tracking-widest font-bold text-slate-800 placeholder-slate-300 bg-slate-50 focus:bg-white transition-all outline-none" placeholder="Ketik Token..." value={inputToken} onChange={(e) => setInputToken(e.target.value.toUpperCase())} required disabled={isChecking || dbStatus === 'error'}/>
                      </div>
                      {error && <p className="mt-2 text-sm text-rose-500 font-medium flex items-center"><AlertCircle size={14} className="mr-1.5"/> {error}</p>}
                    </div>
                    <button type="submit" disabled={isChecking || dbStatus === 'error'} className="w-full flex justify-center py-3.5 px-4 rounded-xl text-base font-bold text-white bg-primary-700 hover:bg-primary-800 transition-all shadow-md disabled:opacity-50 mt-2">
                      {isChecking ? 'Memeriksa Akses...' : 'Masuk Ujian'}
                    </button>
                  </form>
                  <div className="mt-8 pt-6 border-t border-slate-100 flex justify-between items-center">
                     <span className={`text-[10px] font-black uppercase tracking-wider px-3 py-1.5 rounded flex items-center ${dbStatus === 'connected' ? 'bg-success/10 text-success-700 border border-success/20' : 'bg-rose-50 text-rose-600 border border-rose-100'}`}>
                         <Cloud size={12} className="mr-1.5"/> {dbStatus === 'connected' ? 'Server Online' : 'Server Offline'}
                     </span>
                     <button onClick={() => navigate('/admin/login')} className="text-[10px] font-black uppercase tracking-wider text-slate-400 hover:text-primary-700 transition-colors flex items-center"><Settings size={12} className="mr-1"/> Master Admin</button>
                  </div>
                </div>
              </div>
            );
          };

          const ParticipantInstruction = () => {
            const [isStarting, setIsStarting] = useState(false);
            if (!activeSession || !activeSession.participant) { navigate('/login'); return null; }
            
            const startExam = async () => {
              setIsStarting(true);
              try {
                const db = await getSupabase();
                await db.from('tokens').update({ status: 'USED' }).eq('code', activeSession.token);

                let sessionQuestions = JSON.parse(JSON.stringify(activeQuestions));
                if (isRandomQ) {
                    for (let i = sessionQuestions.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [sessionQuestions[i], sessionQuestions[j]] = [sessionQuestions[j], sessionQuestions[i]];
                    }
                }
                if (isRandomOpt) {
                    sessionQuestions = sessionQuestions.map(q => {
                        if (q.type === 'MCQ' && q.options) {
                            const originalOptions = [...q.options];
                            const texts = originalOptions.map(o => o.text);
                            for (let i = texts.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [texts[i], texts[j]] = [texts[j], texts[i]]; }
                            q.options = originalOptions.map((opt, idx) => ({ ...opt, text: texts[idx] }));
                            const originalCorrectText = originalOptions.find(o => o.id === q.correctAnswer)?.text;
                            const newCorrectOption = q.options.find(o => o.text === originalCorrectText);
                            if (newCorrectOption) q.correctAnswer = newCorrectOption.id;
                        }
                        return q;
                    });
                }

                let durationLimitMs = 120 * 60 * 1000;
                if (examDate && endTimeStr) {
                    const endDateTime = new Date(`${examDate}T${endTimeStr}:00`).getTime();
                    durationLimitMs = Math.max(60000, endDateTime - new Date().getTime());
                }

                setActiveSession(prev => ({ ...prev, status: 'ACTIVE', startTime: new Date().getTime(), durationLimit: durationLimitMs, sessionQuestions, examCurrentIndex: 0 }));
                navigate('/exam');
              } catch (err) { showAlert("Gagal memulai sistem ujian: " + err.message); setIsStarting(false); }
            };

            const stats = activeQuestions.reduce((acc, q) => { const diff = q.difficulty || 'Mudah'; acc[diff] = (acc[diff] || 0) + 1; return acc; }, { Mudah: 0, Sedang: 0, Sulit: 0 });

            return (
              <div className="min-h-screen bg-background py-10 px-4 flex justify-center items-center font-sans">
                 <div className="max-w-3xl w-full bg-white rounded-3xl shadow-xl p-8 md:p-10 border-t-4 border-primary-700 relative overflow-hidden">
                    <div className="absolute top-0 right-0 p-8 opacity-5 pointer-events-none"><Trophy size={180}/></div>
                    <div className="flex items-center mb-8 pb-5 border-b border-slate-100">
                       <div className="w-12 h-12 bg-primary-50 text-primary-700 flex items-center justify-center rounded-xl mr-4"><FileText size={24} /></div>
                       <div>
                           <h2 className="text-[24px] font-bold text-primary-800">Petunjuk Pengerjaan Olimpiade</h2>
                           <p className="text-slate-500 font-semibold text-[16px] mt-1">Harap baca dengan cermat sebelum memulai kompetisi.</p>
                       </div>
                    </div>
                    
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-8 mb-8">
                        <div className="space-y-4">
                            <h3 className="font-bold text-slate-800 uppercase tracking-widest text-xs">Tata Tertib Sistem</h3>
                            <ul className="space-y-3 text-slate-600 text-sm font-medium">
                                <li className="flex items-start"><CheckCircle className="text-success mr-2.5 mt-0.5 flex-shrink-0" size={16}/> Waktu otomatis berhenti pada jam selesai.</li>
                                <li className="flex items-start"><CheckCircle className="text-success mr-2.5 mt-0.5 flex-shrink-0" size={16}/> Jawaban tersimpan otomatis per soal.</li>
                                <li className="flex items-start text-rose-600 bg-rose-50 p-3 rounded-lg border border-rose-100"><AlertCircle className="text-rose-500 mr-2.5 mt-0.5 flex-shrink-0" size={16}/> Sistem menggunakan pendeteksi tab otomatis. Pelanggaran (membuka tab lain) akan dicatat untuk diskualifikasi.</li>
                            </ul>
                        </div>
                        <div>
                            <h3 className="font-bold text-slate-800 uppercase tracking-widest text-xs mb-4">Struktur & Pembobotan Soal</h3>
                            <div className="space-y-3">
                                <div className="flex justify-between items-center bg-slate-50 p-3 rounded-lg border border-slate-200"><span className="text-sm font-bold text-slate-600">Total Soal Keseluruhan</span><span className="font-black text-lg text-slate-800">{activeQuestions.length}</span></div>
                                <div className="flex gap-2">
                                    <div className="flex-1 bg-success/10 border border-success/20 p-2 rounded-lg text-center"><div className="text-[10px] font-black uppercase text-success-700 tracking-wider">Mudah (1.00)</div><div className="font-black text-lg text-success-800">{stats.Mudah}</div></div>
                                    <div className="flex-1 bg-primary-50 border border-primary-100 p-2 rounded-lg text-center"><div className="text-[10px] font-black uppercase text-primary-600 tracking-wider">Sedang (1.25)</div><div className="font-black text-lg text-primary-800">{stats.Sedang}</div></div>
                                    <div className="flex-1 bg-rose-50 border border-rose-100 p-2 rounded-lg text-center"><div className="text-[10px] font-black uppercase text-rose-600 tracking-wider">Sulit (1.50)</div><div className="font-black text-lg text-rose-800">{stats.Sulit}</div></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="bg-primary-800 p-5 rounded-2xl flex flex-col sm:flex-row items-center justify-between gap-4 shadow-lg">
                       <div className="text-white text-center sm:text-left">
                         <span className="text-primary-200 text-xs font-bold uppercase tracking-widest">Identitas Peserta</span><br/>
                         <strong className="text-lg block sm:inline">{activeSession.participant.name}</strong> <span className="hidden sm:inline text-primary-400 mx-2">|</span> <span className="text-primary-100 text-sm">{activeSession.participant.school}</span>
                       </div>
                       <button onClick={startExam} disabled={isStarting || activeQuestions.length === 0} className="w-full sm:w-auto py-3.5 px-8 bg-secondary text-white font-black uppercase tracking-widest rounded-xl hover:bg-secondary-600 transition-transform hover:scale-105 disabled:opacity-50 shadow-md">
                           {isStarting ? 'Memproses...' : 'Mulai Ujian'}
                       </button>
                    </div>
                 </div>
              </div>
            );
          };

          const ExamEngine = () => {
            const [timeLeft, setTimeLeft] = useState(0);
            
            useEffect(() => {
                if (!activeSession || activeSession.status !== 'ACTIVE') return;
                const preventDefaultAction = (e) => e.preventDefault();
                const handleVisibilityChange = () => {
                    if (document.hidden) {
                        showAlert("PERINGATAN PELANGGARAN!\nSistem mendeteksi Anda beralih ke layar/tab lain. Tindakan ini dicatat sebagai potensi kecurangan (Cheating Log).");
                        setActiveSession(prev => ({ ...prev, cheatWarnings: (prev.cheatWarnings || 0) + 1 }));
                    }
                };
                document.addEventListener('contextmenu', preventDefaultAction);
                document.addEventListener('copy', preventDefaultAction);
                document.addEventListener('visibilitychange', handleVisibilityChange);
                return () => {
                    document.removeEventListener('contextmenu', preventDefaultAction);
                    document.removeEventListener('copy', preventDefaultAction);
                    document.removeEventListener('visibilitychange', handleVisibilityChange);
                };
            }, [activeSession?.status]);

            const examCurrentIndex = activeSession?.examCurrentIndex || 0;
            const setExamCurrentIndex = (idx) => setActiveSession(prev => ({ ...prev, examCurrentIndex: idx }));
            
            useEffect(() => { 
                if (!activeSession || activeSession.status !== 'ACTIVE') navigate('/'); 
                triggerMathRender(); 
            }, [activeSession?.status, examCurrentIndex]);

            useEffect(() => {
              if (!activeSession || activeSession.status !== 'ACTIVE') return;
              const timer = setInterval(() => {
                const now = new Date().getTime();
                const remaining = Math.max(0, Math.floor(((activeSession.startTime + activeSession.durationLimit) - now) / 1000));
                setTimeLeft(remaining);
                if (remaining <= 0) { clearInterval(timer); navigate('/review'); } 
              }, 1000);
              return () => clearInterval(timer);
            }, [activeSession]);

            const examQuestions = activeSession?.sessionQuestions || activeQuestions;
            if (!activeSession || examQuestions.length === 0 || !examQuestions[examCurrentIndex]) return <div className="min-h-screen flex items-center justify-center font-medium text-slate-500 font-sans">Memuat soal...</div>;
            
            const currentQuestion = examQuestions[examCurrentIndex];
            const currentAnswer = activeSession.answers[currentQuestion.id];
            const isFlagged = activeSession.flagged?.includes(currentQuestion.id);
            
            const handleAnswerChange = (val) => { setActiveSession(prev => ({ ...prev, answers: { ...prev.answers, [currentQuestion.id]: val } })); };
            const toggleFlag = () => { setActiveSession(prev => ({ ...prev, flagged: isFlagged ? prev.flagged.filter(id => id !== currentQuestion.id) : [...(prev.flagged || []), currentQuestion.id] })); };

            const getDiffBadge = (diff) => {
                if (diff === 'Sulit') return <span className="bg-rose-100 text-rose-700 border border-rose-200 px-2 py-0.5 rounded text-[10px] font-black uppercase tracking-wider ml-2 font-sans">Sulit</span>;
                if (diff === 'Sedang') return <span className="bg-primary-100 text-primary-700 border border-primary-200 px-2 py-0.5 rounded text-[10px] font-black uppercase tracking-wider ml-2 font-sans">Sedang</span>;
                return <span className="bg-success/20 text-success-700 border border-success/30 px-2 py-0.5 rounded text-[10px] font-black uppercase tracking-wider ml-2 font-sans">Mudah</span>;
            };

            const RenderMCQ = () => (
              <div className="space-y-4 mt-6">
                {(currentQuestion.options||[]).map(opt => (
                  <label key={opt.id} className={`flex items-start p-5 border-2 rounded-xl cursor-pointer transition-all ${currentAnswer === opt.id ? 'border-primary-500 bg-primary-50 shadow-sm' : 'border-slate-200 hover:bg-slate-50'}`}>
                    <div className="flex items-center h-6 mt-1"><input type="radio" checked={currentAnswer === opt.id} onChange={() => { handleAnswerChange(opt.id); setTimeout(() => {if(examCurrentIndex < examQuestions.length - 1) setExamCurrentIndex(examCurrentIndex + 1);}, 300); }} className="w-5 h-5 accent-primary-600" /></div>
                    <div className="ml-4 flex-1 flex text-slate-800"><span className="font-bold text-slate-400 w-6 mt-1 font-sans text-[18px]">{opt.id}.</span><div className="flex-1 rich-text-content font-reading text-[16px] md:text-[18px] leading-[1.7]" dangerouslySetInnerHTML={{__html: opt.text}}></div></div>
                  </label>
                ))}
              </div>
            );

            const RenderSHORT = () => {
               return (
                  <div className="mt-6">
                     <div className="bg-blue-50/50 border border-blue-200 text-blue-800 p-4 rounded-xl font-medium text-sm mb-4 flex items-center">
                        <AlertCircle size={18} className="mr-2 text-blue-600 flex-shrink-0"/> Jawablah dengan singkat, padat, dan jelas.
                     </div>
                     <input
                        type="text"
                        /* Tambahkan select-text dan style inline untuk mem-bypass prevent-select global */
                        className="w-full p-4 border border-slate-300 rounded-xl focus:ring-2 focus:ring-primary-500 outline-none text-slate-800 font-reading font-semibold text-lg select-text"
                        style={{ userSelect: 'auto', WebkitUserSelect: 'auto' }}
                        placeholder="Ketik jawaban singkat di sini..."
                        value={currentAnswer || ''}
                        onChange={(e) => handleAnswerChange(e.target.value)}
                     />
                  </div>
               );
            };

            const RenderESSAY = () => {
               return (
                  <div className="mt-6">
                     <div className="bg-emerald-50/50 border border-emerald-200 text-emerald-800 p-4 rounded-xl font-medium text-sm mb-4 flex items-center">
                        <AlertCircle size={18} className="mr-2 text-emerald-600 flex-shrink-0"/> Jawablah uraian secara rinci dan komprehensif. (Penilaian rubrik guru)
                     </div>
                     <textarea
                        /* Tambahkan select-text dan style inline untuk mem-bypass prevent-select global */
                        className="w-full p-4 border border-slate-300 rounded-xl focus:ring-2 focus:ring-primary-500 outline-none text-slate-800 min-h-[200px] font-reading resize-y select-text"
                        style={{ userSelect: 'auto', WebkitUserSelect: 'auto' }}
                        placeholder="Tulis uraian jawaban secara lengkap..."
                        value={currentAnswer || ''}
                        onChange={(e) => handleAnswerChange(e.target.value)}
                     ></textarea>
                  </div>
               );
            };
            const fmtTime = (s) => `${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`;

            return (
              <div className="min-h-screen bg-background flex flex-col prevent-select">
                <header className="bg-primary-800 shadow-md px-4 sm:px-6 py-3 flex justify-between items-center sticky top-0 z-20 border-b-4 border-secondary font-sans">
                   <div className="flex items-center">
                      <div className="hidden sm:flex w-10 h-10 bg-secondary rounded-lg items-center justify-center text-white mr-3 shadow-sm"><Medal size={20}/></div>
                      <div><h1 className="text-lg font-black text-white leading-tight uppercase tracking-wider">Kelas Olimpiade</h1><p className="text-xs text-secondary-200 font-bold tracking-widest uppercase">{activeSession.participant?.name}</p></div>
                   </div>
                   <div className={`flex items-center font-bold text-lg px-4 py-2 rounded-lg border-2 shadow-inner ${timeLeft < 300 ? 'bg-rose-600 border-rose-500 text-white animate-pulse' : 'bg-primary-900 border-primary-700 text-secondary'}`}>
                      <Clock size={18} className="mr-2" /> {fmtTime(timeLeft)}
                   </div>
                </header>
                <div className="flex-1 flex flex-col lg:flex-row max-w-[1400px] w-full mx-auto p-4 sm:p-6 gap-6 font-sans">
                   <div className="flex-1 flex flex-col min-w-0">
                      <div className="bg-white rounded-3xl shadow-sm border border-slate-200 p-6 sm:p-10 flex-1 flex flex-col relative overflow-hidden">
                         <div className="flex flex-wrap gap-2 justify-between items-center mb-6 pb-5 border-b border-slate-100">
                            <div className="flex items-center">
                                <h2 className="text-[18px] font-black text-primary-800 font-sans">SOAL {examCurrentIndex + 1}</h2>
                                {getDiffBadge(currentQuestion.difficulty)}
                            </div>
                            <span className="text-[10px] font-black px-3 py-1.5 rounded bg-slate-100 text-slate-500 uppercase tracking-widest border border-slate-200 font-sans">{currentQuestion.type === 'MCQ' ? 'PILIHAN GANDA' : currentQuestion.type === 'SHORT' ? 'ISIAN SINGKAT' : 'URAIAN/ESSAY'}</span>
                         </div>
                         <div className="flex-1 overflow-y-auto pr-2 pb-8">
                            <div className="text-[18px] md:text-[20px] text-slate-800 font-reading leading-[1.8] max-w-[80ch] mb-6 rich-text-content" dangerouslySetInnerHTML={{ __html: currentQuestion.question || '' }} />
                            {currentQuestion.type === 'MCQ' && <RenderMCQ />}
                            {currentQuestion.type === 'SHORT' && <RenderSHORT />}
                            {currentQuestion.type === 'ESSAY' && <RenderESSAY />}
                         </div>
                         <div className="pt-6 mt-6 border-t border-slate-100 flex flex-wrap justify-between items-center gap-3 font-sans">
                            <button onClick={() => setExamCurrentIndex(Math.max(0, examCurrentIndex - 1))} disabled={examCurrentIndex === 0} className="px-5 py-3 bg-white text-slate-700 rounded-xl disabled:opacity-50 font-bold border-2 border-slate-200 hover:bg-slate-50 transition-colors shadow-sm"><ChevronLeft size={18} className="inline mr-1" /> Sebelum</button>
                            <label className={`flex items-center px-5 py-3 rounded-xl font-bold border-2 cursor-pointer transition-all shadow-sm ${isFlagged ? 'bg-secondary/20 border-secondary text-secondary-800' : 'bg-white border-slate-200 text-slate-500 hover:bg-slate-50'}`}>
                               <input type="checkbox" checked={isFlagged} onChange={toggleFlag} className="mr-2 w-5 h-5 accent-secondary rounded" /> Tandai Ragu
                            </label>
                            {examCurrentIndex < examQuestions.length - 1 ? (
                               <button onClick={() => setExamCurrentIndex(examCurrentIndex + 1)} className="px-8 py-3 bg-primary-700 text-white font-black uppercase tracking-wider rounded-xl hover:bg-primary-800 shadow-md transition-colors">Lanjut</button>
                            ) : (
                               <button onClick={() => navigate('/review')} className="px-8 py-3 bg-success text-white font-black uppercase tracking-wider rounded-xl hover:bg-success-600 shadow-[0_0_15px_rgba(16,185,129,0.4)] transition-all">Selesai</button>
                            )}
                         </div>
                      </div>
                   </div>
                   <div className="lg:w-80 w-full flex-shrink-0">
                      <div className="bg-white rounded-3xl shadow-sm border border-slate-200 p-6 sticky top-24 font-sans">
                         <h3 className="text-[14px] font-black uppercase tracking-widest text-primary-800 mb-5 flex items-center border-b border-slate-100 pb-4"><LayoutDashboard size={18} className="mr-2 text-primary-500"/> Navigasi Soal</h3>
                         <div className="grid grid-cols-5 gap-2.5 max-h-[50vh] overflow-y-auto pr-1">
                            {examQuestions.map((q, idx) => {
                               const ans = activeSession.answers[q.id];
                               const isAns = q.type==='MCQ'? !!ans : (typeof ans==='string' && ans.trim()!=='');
                               const isCur = idx === examCurrentIndex;
                               const isFlg = activeSession.flagged?.includes(q.id);
                               let cls = "h-11 w-full rounded-xl font-black text-[14px] flex items-center justify-center border-2 transition-all cursor-pointer shadow-sm ";
                               if (isCur) cls += "ring-4 ring-primary-500/30 bg-white text-primary-800 border-primary-500 transform scale-105 z-10";
                               else if (isFlg) cls += "bg-secondary text-white border-secondary-600";
                               else if (isAns) cls += "bg-success text-white border-success-600";
                               else cls += "bg-slate-50 text-slate-400 border-slate-200 hover:bg-slate-100";
                               return <button key={q.id} onClick={() => setExamCurrentIndex(idx)} className={cls}>{idx + 1}</button>;
                            })}
                         </div>
                         <div className="mt-6 pt-5 border-t border-slate-100 space-y-2">
                             <div className="flex items-center text-xs font-bold text-slate-500"><div className="w-4 h-4 rounded bg-success border border-success-600 mr-2"></div> Sudah Dijawab</div>
                             <div className="flex items-center text-xs font-bold text-slate-500"><div className="w-4 h-4 rounded bg-secondary border border-secondary-600 mr-2"></div> Ragu-Ragu</div>
                             <div className="flex items-center text-xs font-bold text-slate-500"><div className="w-4 h-4 rounded bg-slate-50 border-2 border-slate-200 mr-2"></div> Belum Dijawab</div>
                         </div>
                      </div>
                   </div>
                </div>
              </div>
            );
          };

          const ExamReview = () => {
             const [isSubmitting, setIsSubmitting] = useState(false);
             const [showFinalConfirm, setShowFinalConfirm] = useState(false);
             if (!activeSession || activeSession.status !== 'ACTIVE') { navigate('/'); return null; }

             const examQuestions = activeSession?.sessionQuestions || activeQuestions;
             const totalQ = examQuestions.length;
             const ansQ = examQuestions.filter(q => {
                const ans = activeSession.answers[q.id];
                if(q.type==='MCQ') return !!ans;
                return (typeof ans==='string' && ans.trim()!=='');
             }).length;

             const handleFinalSubmit = async () => {
               setIsSubmitting(true);
               const result = calculateScore(activeSession.answers, examQuestions);
               const finalDetailedResults = [...result.detailedResults, { qId: 'SYS_CHEATS', cheatCount: activeSession.cheatWarnings || 0 }];
               
               const dbPayload = {
                  participant_name: activeSession.participant.name, participant_school: activeSession.participant.school,
                  participant_nis: activeSession.participant.nis, participant_grade: activeSession.participant.grade,
                  token: activeSession.token, score: result.finalScore, start_time: activeSession.startTime, end_time: new Date().getTime(), 
                  detailed_results: JSON.stringify({
                      details: finalDetailedResults,
                      stats: { ito: result.ito, correctMudah: result.correctMudah, correctSedang: result.correctSedang, correctSulit: result.correctSulit, totalMudah: result.totalMudah, totalSedang: result.totalSedang, totalSulit: result.totalSulit, pMudah: result.pMudah, pSedang: result.pSedang, pSulit: result.pSulit }
                  })
               };
               
               try {
                 const db = await getSupabase();
                 await db.from('results').insert([dbPayload]);
                 setStudentResultPayload(dbPayload); setActiveSession(null); navigate('/submitted'); 
               } catch (err) { showAlert("Gagal mengirim data ke server: " + err.message); setIsSubmitting(false); setShowFinalConfirm(false); }
             };

             return (
               <div className="min-h-screen bg-primary-900 flex py-10 px-4 justify-center items-center relative overflow-hidden font-sans">
                   <div className="absolute -top-40 -right-40 w-96 h-96 bg-secondary rounded-full blur-[100px] opacity-20"></div>
                   <div className="absolute -bottom-40 -left-40 w-96 h-96 bg-primary-500 rounded-full blur-[100px] opacity-20"></div>

                   <div className="bg-white p-8 md:p-12 rounded-3xl shadow-2xl max-w-2xl w-full text-center relative z-10">
                      <div className="w-20 h-20 bg-primary-50 text-primary-600 rounded-2xl flex items-center justify-center mx-auto mb-6"><CheckSquare size={36}/></div>
                      <h2 className="text-3xl font-black mb-2 text-primary-800">Konfirmasi Pengumpulan</h2>
                      <p className="text-slate-500 font-medium mb-8 text-[16px]">Pastikan semua soal telah terjawab dengan maksimal sebelum mengakhiri kelas olimpiade.</p>
                      
                      <div className="grid grid-cols-2 gap-5 mb-10">
                         <div className="p-6 bg-slate-50 border-2 border-slate-100 rounded-2xl"><p className="text-slate-500 text-xs font-black uppercase tracking-widest mb-2">Total Soal</p><p className="text-5xl font-black text-slate-800">{totalQ}</p></div>
                         <div className="p-6 bg-success/10 border-2 border-success/20 rounded-2xl"><p className="text-success-700 text-xs font-black uppercase tracking-widest mb-2">Terjawab</p><p className="text-5xl font-black text-success">{ansQ}</p></div>
                      </div>
                      
                      {!showFinalConfirm ? (
                         <div className="flex gap-4">
                            <button onClick={()=>navigate('/exam')} className="flex-1 py-4 border-2 border-slate-200 rounded-xl font-bold text-slate-600 hover:bg-slate-50 hover:text-slate-800 transition-colors uppercase tracking-wider">Kembali Periksa</button>
                            <button onClick={()=>setShowFinalConfirm(true)} className="flex-1 py-4 bg-primary-800 text-white rounded-xl font-black hover:bg-primary-900 transition-colors shadow-lg uppercase tracking-wider">Kirim Jawaban</button>
                         </div>
                      ) : (
                         <div className="p-6 bg-rose-50 rounded-2xl border-2 border-rose-100 animate-fade-in-up">
                            <p className="font-black text-rose-600 mb-5 text-lg uppercase tracking-wider">Kirim secara permanen?</p>
                            <div className="flex gap-4">
                               <button onClick={()=>setShowFinalConfirm(false)} className="flex-1 py-3.5 bg-white border-2 border-slate-200 rounded-xl font-bold text-slate-600 hover:bg-slate-50 transition-colors">Batal</button>
                               <button onClick={handleFinalSubmit} disabled={isSubmitting} className="flex-1 py-3.5 bg-rose-600 text-white rounded-xl font-black shadow-md hover:bg-rose-700 transition-colors uppercase tracking-wider disabled:opacity-50">{isSubmitting ? 'Mengirim Data...' : 'Ya, Akhiri Ujian'}</button>
                            </div>
                         </div>
                      )}
                   </div>
               </div>
             );
          };

          const ExamSubmitted = () => {
             if (!studentResultPayload) return <div className="min-h-screen flex items-center justify-center font-sans font-bold text-slate-500">Memuat Hasil...</div>;

             return (
                <div className="min-h-screen bg-background py-10 px-4 flex justify-center items-center font-sans">
                    <div className="bg-white p-10 rounded-3xl shadow-xl max-w-md w-full text-center border-t-4 border-success animate-fade-in-up">
                        <div className="w-20 h-20 bg-success/10 text-success-600 rounded-full flex items-center justify-center mx-auto mb-6"><CheckCircle size={40}/></div>
                        <h2 className="text-[24px] font-black text-slate-800 uppercase tracking-widest mb-2">Ujian Selesai</h2>
                        <p className="text-slate-500 font-medium text-[16px] mb-8 leading-relaxed">Jawaban Anda telah berhasil diunggah ke sistem secara permanen. Silakan kembali ke layar utama.</p>
                        <button onClick={() => { setStudentResultPayload(null); navigate('/'); }} className="w-full py-4 bg-slate-800 text-white font-black uppercase tracking-widest rounded-xl hover:bg-slate-900 transition-colors shadow-md">Selesai & Keluar</button>
                    </div>
                </div>
             );
          };

          const AdminLogin = () => {
            const [u, setU] = useState(''); const [p, setP] = useState(''); const [showP, setShowP] = useState(false);
            return (
              <div className="min-h-screen bg-primary-900 flex justify-center items-center p-4 relative overflow-hidden font-sans">
                <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] bg-primary-600/20 rounded-full blur-[120px] pointer-events-none"></div>
                <form onSubmit={(e)=>{
                    e.preventDefault(); 
                    if(u==='admin'&&p==='bismillah') { setIsAdminLoggedIn(true); navigate('/admin/dashboard'); } 
                    else { showAlert('Username atau password salah.'); }
                }} className="bg-white/10 backdrop-blur-xl border border-white/20 p-10 rounded-3xl max-w-sm w-full shadow-2xl relative z-10">
                   <div className="text-center mb-8">
                       <div className="w-16 h-16 bg-gradient-to-br from-primary-500 to-primary-700 text-white rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg"><Settings size={32}/></div>
                       <h1 className="text-2xl font-black text-white uppercase tracking-widest">Master Admin</h1>
                       <p className="text-primary-200/60 text-xs mt-1 font-medium tracking-widest">SISTEM KELAS OLIMPIADE</p>
                   </div>
                   <div className="space-y-4 mb-8">
                       <input type="text" placeholder="Username ID" value={u} onChange={e=>setU(e.target.value)} className="w-full p-4 bg-white/5 border border-white/10 rounded-xl text-white placeholder-white/30 text-sm focus:bg-white/10 focus:border-primary-400 outline-none transition-all font-medium tracking-wide" required/>
                       <div className="relative">
                           <input type={showP ? "text" : "password"} placeholder="Password Key" value={p} onChange={e=>setP(e.target.value)} className="w-full p-4 bg-white/5 border border-white/10 rounded-xl text-white placeholder-white/30 text-sm focus:bg-white/10 focus:border-primary-400 outline-none transition-all pr-12 font-medium tracking-wide" required/>
                           <button type="button" onClick={()=>setShowP(!showP)} className="absolute right-4 top-4 text-white/40 hover:text-white transition-colors">{showP ? <EyeSlash size={20}/> : <Eye size={20}/>}</button>
                       </div>
                   </div>
                   <button type="submit" className="w-full py-4 bg-primary-600 hover:bg-primary-500 transition-colors text-white font-black uppercase tracking-widest rounded-xl shadow-[0_0_20px_rgba(45,117,195,0.4)]">Akses Sistem</button>
                   <button type="button" onClick={()=>navigate('/')} className="w-full mt-6 text-xs text-white/40 hover:text-white transition-colors uppercase tracking-widest font-bold">Kembali ke Portal Peserta</button>
                </form>
              </div>
            );
          };

          const AdminLayout = ({ children, title }) => {
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            if (!isAdminLoggedIn) { navigate('/admin/login'); return null; }
            const menu = [
              { id: 'dashboard', label: 'Dashboard Analitik', icon: LayoutDashboard, path: '/admin/dashboard' },
              { id: 'questions', label: 'Bank Soal Olimpiade', icon: Database, path: '/admin/questions' },
              { id: 'tokens', label: 'Token Peserta', icon: Key, path: '/admin/tokens' },
              { id: 'results', label: 'Hasil & Penilaian', icon: CheckSquare, path: '/admin/results' },
              { id: 'analysis', label: 'Analisis Butir Soal', icon: BarChart2, path: '/admin/analysis' },
              { id: 'reports', label: 'Cetak Laporan', icon: Printer, path: '/admin/reports' }
            ];
            return (
              <div className="min-h-screen bg-background flex print:block font-sans">
                {isMobileMenuOpen && <div className="fixed inset-0 bg-primary-900/60 z-40 lg:hidden backdrop-blur-sm" onClick={() => setIsMobileMenuOpen(false)} />}
                <div className={`fixed inset-y-0 left-0 z-50 w-72 bg-primary-800 text-primary-200 flex flex-col transform ${isMobileMenuOpen ? 'translate-x-0' : '-translate-x-full'} lg:relative lg:translate-x-0 transition-transform shadow-2xl`}>
                  <div className="p-6 flex items-center justify-between border-b border-primary-900/50">
                      <div className="flex items-center">
                          <div className="w-10 h-10 bg-gradient-to-br from-secondary-400 to-secondary-600 text-white rounded-xl flex items-center justify-center mr-3 shadow-lg"><Medal size={20}/></div>
                          <div><div className="text-white font-black tracking-wider leading-tight">MASTER ADMIN</div><div className="text-[9px] text-secondary font-bold uppercase tracking-widest">Kelas Olimpiade</div></div>
                      </div>
                      <button className="lg:hidden text-primary-300 bg-white/10 p-2 rounded-lg" onClick={() => setIsMobileMenuOpen(false)}><X size={16}/></button>
                  </div>
                  <nav className="flex-1 py-6 space-y-2 px-4">
                      {menu.map(m => {
                          const isActive = currentRoute.startsWith(m.path);
                          return (
                              <button key={m.id} onClick={() => { setIsMobileMenuOpen(false); navigate(m.path); }} className={`w-full flex items-center px-4 py-3.5 rounded-xl text-[14px] font-bold transition-all ${isActive ? 'bg-primary-600 text-white shadow-md' : 'text-primary-300 hover:bg-primary-900 hover:text-white'}`}>
                                  <m.icon size={18} className={`mr-3 ${isActive ? 'text-primary-200' : 'opacity-70'}`}/> {m.label}
                              </button>
                          );
                      })}
                  </nav>
                  <div className="p-6 border-t border-primary-900/50"><button onClick={() => { setIsAdminLoggedIn(false); navigate('/admin/login'); }} className="w-full flex items-center justify-center px-4 py-3.5 text-sm font-bold text-rose-300 hover:text-white hover:bg-rose-600 rounded-xl transition-colors"><LogOut size={16} className="mr-2"/> Keluar Sistem</button></div>
                </div>
                <div className="flex-1 flex flex-col h-screen overflow-hidden print:h-auto print:block relative">
                  <header className="bg-white border-b border-slate-200 px-6 sm:px-8 py-5 flex justify-between items-center sticky top-0 z-10 print:hidden shadow-sm">
                    <div className="flex items-center gap-4"><button className="lg:hidden p-2.5 bg-slate-100 rounded-xl text-slate-600 hover:bg-slate-200 transition-colors" onClick={() => setIsMobileMenuOpen(true)}><Menu size={20}/></button><h2 className="text-[20px] md:text-[24px] font-black text-primary-800 uppercase tracking-wide">{title}</h2></div>
                    <span className="text-[10px] font-black tracking-widest uppercase px-3 py-1.5 bg-success/10 text-success-700 border border-success/20 rounded-lg flex items-center shadow-sm"><Cloud size={12} className="mr-1.5"/> Data Sinkron</span>
                  </header>
                  <main className="flex-1 overflow-y-auto p-6 lg:p-8 print:p-0 relative">
                      {children}
                  </main>
                </div>
              </div>
            );
          };

          const AdminDashboard = () => {
             const [tempOrganizer, setTempOrganizer] = useState(organizerName);
             const [tempLogo, setTempLogo] = useState(schoolLogo);
             const [tempDate, setTempDate] = useState(examDate);
             const [tempStartTime, setTempStartTime] = useState(startTimeStr);
             const [tempEndTime, setTempEndTime] = useState(endTimeStr);
             const [tempRandomQ, setTempRandomQ] = useState(isRandomQ);
             const [tempRandomOpt, setTempRandomOpt] = useState(isRandomOpt);
             const [isSaving, setIsSaving] = useState(false);

             const handleLogoUpload = (e) => {
                 const file = e.target.files[0];
                 if (file) { const reader = new FileReader(); reader.onloadend = () => setTempLogo(reader.result); reader.readAsDataURL(file); }
             };

             const saveSettings = async () => {
                setIsSaving(true);
                try {
                    const db = await getSupabase();
                    const upsertSetting = async (code, val) => {
                        const { data } = await db.from('tokens').select('code').eq('code', code).maybeSingle();
                        if (data) await db.from('tokens').update({ status: val }).eq('code', code);
                        else await db.from('tokens').insert([{ code, status: val, generatedAt: new Date().toISOString() }]);
                    };
                    await Promise.all([
                        upsertSetting('SYS_SETTING_ORGANIZER', tempOrganizer), upsertSetting('SYS_SETTING_LOGO', tempLogo),
                        upsertSetting('SYS_SETTING_DATE', tempDate), upsertSetting('SYS_SETTING_START_TIME', tempStartTime), upsertSetting('SYS_SETTING_END_TIME', tempEndTime),
                        upsertSetting('SYS_SETTING_RANDOM_Q', tempRandomQ ? 'TRUE' : 'FALSE'), upsertSetting('SYS_SETTING_RANDOM_OPT', tempRandomOpt ? 'TRUE' : 'FALSE')
                    ]);
                    setOrganizerName(tempOrganizer); setSchoolLogo(tempLogo); setExamDate(tempDate); setStartTimeStr(tempStartTime); setEndTimeStr(tempEndTime); setIsRandomQ(tempRandomQ); setIsRandomOpt(tempRandomOpt);
                    showAlert("Pengaturan sistem berhasil diperbarui!");
                } catch(e) { showAlert("Gagal menyimpan pengaturan: " + e.message); }
                setIsSaving(false);
             };

             const sortedResults = sortOlympiadResults(results);
             const top10 = sortedResults.slice(0, 10);
             const kandidatOSNList = sortedResults.filter(r => (r.detail?.stats?.ito || 0) >= 70);
             const kandidatOsnCount = kandidatOSNList.length;

             // Distribusi Nilai (Berdasarkan Skor Akhir)
             const scoreBins = { '0-20': 0, '21-40': 0, '41-60': 0, '61-80': 0, '81-100': 0 };
             let maxBinCount = 0;
             results.forEach(r => {
                 const s = r.score || 0;
                 if(s <= 20) scoreBins['0-20']++;
                 else if(s <= 40) scoreBins['21-40']++;
                 else if(s <= 60) scoreBins['41-60']++;
                 else if(s <= 80) scoreBins['61-80']++;
                 else scoreBins['81-100']++;
             });
             Object.values(scoreBins).forEach(v => { if(v > maxBinCount) maxBinCount = v; });

             // Analisis Tingkat Kesulitan & Materi
             let diffStats = { Mudah: {c:0, t:0}, Sedang: {c:0, t:0}, Sulit: {c:0, t:0} };
             let materiStats = {};

             results.forEach(r => {
                 const details = r.detail?.detailedResults || [];
                 details.forEach(d => {
                     const q = questions.find(x => x.id === d.qId);
                     if(q) {
                         const diff = q.difficulty || 'Mudah';
                         const folder = q.folder || 'Utama';

                         if(!diffStats[diff]) diffStats[diff] = {c:0, t:0};
                         diffStats[diff].t++;
                         if(d.isCorrect) diffStats[diff].c++;

                         if(!materiStats[folder]) materiStats[folder] = {c:0, t:0};
                         materiStats[folder].t++;
                         if(d.isCorrect) materiStats[folder].c++;
                     }
                 });
             });

             return (
                <AdminLayout title="Dashboard Analitik & Pusat Kendali">
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                    <div className="bg-white p-6 rounded-3xl border shadow-sm relative overflow-hidden group">
                        <div className="absolute top-0 right-0 p-4 opacity-5 group-hover:scale-110 transition-transform"><User size={80}/></div>
                        <div className="text-slate-400 text-[10px] font-black tracking-widest uppercase mb-1 relative z-10 font-sans">Total Peserta Ujian</div>
                        <div className="text-4xl font-black text-primary-800 relative z-10 font-sans">{results.length}</div>
                    </div>
                    <div className="bg-white p-6 rounded-3xl border shadow-sm relative overflow-hidden group">
                        <div className="absolute top-0 right-0 p-4 opacity-5 group-hover:scale-110 transition-transform"><Medal size={80}/></div>
                        <div className="text-secondary text-[10px] font-black tracking-widest uppercase mb-1 relative z-10 font-sans">Kandidat OSN (ITO &ge; 70)</div>
                        <div className="text-4xl font-black text-secondary relative z-10 font-sans">{kandidatOsnCount}</div>
                    </div>
                    <div className="bg-white p-6 rounded-3xl border shadow-sm relative overflow-hidden group">
                        <div className="absolute top-0 right-0 p-4 opacity-5 group-hover:scale-110 transition-transform"><Database size={80}/></div>
                        <div className="text-slate-400 text-[10px] font-black tracking-widest uppercase mb-1 relative z-10 font-sans">Total Bank Soal</div>
                        <div className="text-4xl font-black text-primary-800 relative z-10 font-sans">{questions.length}</div>
                    </div>
                    <div className="bg-primary-800 p-6 rounded-3xl shadow-lg relative overflow-hidden group">
                        <div className="absolute top-0 right-0 p-4 opacity-10 group-hover:scale-110 transition-transform"><Key size={80} className="text-white"/></div>
                        <div className="text-primary-300 text-[10px] font-black tracking-widest uppercase mb-1 relative z-10 font-sans">Token Aktif</div>
                        <div className="text-4xl font-black text-white relative z-10 font-sans">{tokens.filter(t => !t.code.startsWith('SYS_') && t.status === 'AVAILABLE').length}</div>
                    </div>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-3 gap-8 mb-8 font-sans">
                    <div className="lg:col-span-2 space-y-8">
                        {/* Top 10 Leaderboard */}
                        <div className="bg-white rounded-3xl border shadow-sm p-6">
                            <h3 className="text-[18px] font-black text-primary-800 uppercase tracking-widest mb-6 flex items-center border-b border-slate-100 pb-4"><Trophy size={20} className="mr-3 text-secondary"/> Top 10 Leaderboard</h3>
                            <div className="overflow-x-auto">
                                <table className="w-full text-left text-sm">
                                    <thead><tr className="text-[10px] font-black uppercase tracking-wider text-slate-400 border-b border-slate-100">
                                        <th className="pb-3 w-10 text-center">Rank</th>
                                        <th className="pb-3">Peserta</th>
                                        <th className="pb-3 text-center">Skor Poin</th>
                                        <th className="pb-3 text-center">Nilai ITO</th>
                                    </tr></thead>
                                    <tbody>
                                        {top10.map((r, i) => (
                                            <tr key={r.id} className="border-b border-slate-50 hover:bg-slate-50 transition-colors">
                                                <td className="py-3 text-center font-black text-slate-400 text-[16px]">{i+1}</td>
                                                <td className="py-3">
                                                    <div className="font-bold text-[15px] text-slate-800 uppercase">{r.participant?.name}</div>
                                                    <div className="text-xs text-slate-500 font-medium">{r.participant?.school}</div>
                                                </td>
                                                <td className="py-3 text-center font-black text-[16px] text-slate-700">{r.score}</td>
                                                <td className="py-3 text-center">
                                                    <span className={`px-2 py-1 text-[10px] font-black uppercase tracking-widest rounded border ${getITOCategory(r.detail?.stats?.ito||0).color}`}>{(r.detail?.stats?.ito||0).toFixed(1)}</span>
                                                </td>
                                            </tr>
                                        ))}
                                        {top10.length === 0 && <tr><td colSpan="4" className="text-center py-8 text-slate-400 font-medium text-xs">Belum ada data masuk.</td></tr>}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        {/* Distribusi Nilai & Analisis Materi */}
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            {/* Distribusi Nilai */}
                            <div className="bg-white rounded-3xl border shadow-sm p-6">
                                <h3 className="text-sm font-black text-primary-800 uppercase tracking-widest mb-6 flex items-center border-b border-slate-100 pb-4"><BarChart2 size={16} className="mr-2 text-primary-500"/> Distribusi Nilai</h3>
                                <div className="flex items-end justify-between h-40 gap-2 mt-4">
                                    {Object.entries(scoreBins).map(([range, count]) => {
                                        const h = maxBinCount > 0 ? (count / maxBinCount) * 100 : 0;
                                        return (
                                            <div key={range} className="flex-1 flex flex-col items-center justify-end group">
                                                <span className="text-[10px] font-black text-primary-600 mb-1 opacity-0 group-hover:opacity-100 transition-opacity">{count}</span>
                                                <div className="w-full bg-primary-100 rounded-t-lg relative overflow-hidden flex items-end justify-center" style={{height: '100px'}}>
                                                    <div className="w-full bg-primary-500 rounded-t-lg transition-all duration-1000" style={{height: `${h}%`}}></div>
                                                </div>
                                                <span className="text-[9px] font-black text-slate-500 mt-2 uppercase tracking-widest text-center whitespace-nowrap">{range}</span>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                            {/* Analisis Materi */}
                            <div className="bg-white rounded-3xl border shadow-sm p-6">
                                <h3 className="text-sm font-black text-primary-800 uppercase tracking-widest mb-6 flex items-center border-b border-slate-100 pb-4"><Database size={16} className="mr-2 text-primary-500"/> Analisis Materi</h3>
                                <div className="space-y-4 max-h-48 overflow-y-auto pr-2">
                                    {Object.keys(materiStats).length === 0 ? <p className="text-xs text-slate-400 text-center py-4 font-medium">Belum ada data materi.</p> : null}
                                    {Object.entries(materiStats).map(([folder, stat]) => {
                                        const pct = stat.t > 0 ? Math.round((stat.c / stat.t) * 100) : 0;
                                        return (
                                            <div key={folder}>
                                                <div className="flex justify-between items-end mb-1">
                                                    <span className="text-[10px] font-black uppercase tracking-widest text-slate-600">{folder}</span>
                                                    <span className="text-[10px] font-black text-primary-700">{pct}% Benar</span>
                                                </div>
                                                <div className="w-full bg-slate-100 rounded-full h-2 overflow-hidden"><div className="bg-primary-500 h-2 rounded-full" style={{width: `${pct}%`}}></div></div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="space-y-8">
                        {/* Kandidat OSN Otomatis */}
                        <div className="bg-gradient-to-b from-secondary/10 to-white rounded-3xl border border-secondary/20 shadow-sm p-6">
                            <h3 className="text-sm font-black text-secondary-800 uppercase tracking-widest mb-4 flex items-center border-b border-secondary/20 pb-4"><Star size={16} className="mr-2 text-secondary"/> Kandidat OSN (ITO &ge; 70)</h3>
                            <div className="space-y-3 max-h-60 overflow-y-auto pr-1">
                                {kandidatOSNList.map((r, i) => (
                                    <div key={r.id} className="bg-white p-3 rounded-xl border border-secondary/20 flex justify-between items-center shadow-sm">
                                        <div>
                                            <div className="font-bold text-slate-800 text-[14px] uppercase">{r.participant?.name}</div>
                                            <div className="text-[10px] text-slate-500 font-medium">{r.participant?.school}</div>
                                        </div>
                                        <div className="bg-secondary text-white px-2 py-1 rounded text-xs font-black">
                                            {r.detail?.stats?.ito?.toFixed(1)}
                                        </div>
                                    </div>
                                ))}
                                {kandidatOSNList.length === 0 && <p className="text-xs text-slate-400 text-center py-4 font-medium">Belum ada kandidat potensial.</p>}
                            </div>
                        </div>

                        {/* Analisis Tingkat Kesulitan */}
                        <div className="bg-white rounded-3xl border shadow-sm p-6">
                            <h3 className="text-sm font-black text-primary-800 uppercase tracking-widest mb-6 flex items-center border-b border-slate-100 pb-4"><BarChart2 size={16} className="mr-2 text-primary-500"/> Tingkat Kesulitan</h3>
                            <div className="space-y-5">
                                {['Mudah', 'Sedang', 'Sulit'].map(diff => {
                                    const stat = diffStats[diff];
                                    const pct = stat && stat.t > 0 ? Math.round((stat.c / stat.t) * 100) : 0;
                                    const colorCls = diff === 'Sulit' ? 'bg-rose-500' : diff === 'Sedang' ? 'bg-primary-500' : 'bg-success';
                                    const textCls = diff === 'Sulit' ? 'text-rose-600' : diff === 'Sedang' ? 'text-primary-600' : 'text-success-700';
                                    return (
                                        <div key={diff}>
                                            <div className="flex justify-between items-end mb-1.5">
                                                <span className="text-[10px] font-black uppercase tracking-widest text-slate-600">Level {diff}</span>
                                                <span className={`text-[10px] font-black ${textCls}`}>{pct}% Penguasaan</span>
                                            </div>
                                            <div className="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden"><div className={`${colorCls} h-2.5 rounded-full`} style={{width: `${pct}%`}}></div></div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>

                        {/* Konfigurasi Sistem */}
                        <div className="bg-slate-50 p-6 rounded-3xl border border-slate-200">
                            <h3 className="text-sm font-black text-primary-800 uppercase tracking-widest mb-6 flex items-center"><Settings size={16} className="mr-2 text-slate-400"/> Konfigurasi Sistem</h3>
                            <div className="space-y-4">
                                <div><label className="block text-[10px] font-black uppercase tracking-widest text-slate-500 mb-1.5">Label Penyelenggara</label><input type="text" value={tempOrganizer} onChange={e=>setTempOrganizer(e.target.value)} className="w-full p-3 rounded-xl border border-slate-300 bg-white text-[14px] font-semibold outline-none focus:ring-2 focus:ring-primary-500"/></div>
                                <div>
                                    <label className="block text-[10px] font-black uppercase tracking-widest text-slate-500 mb-1.5">Logo</label>
                                    <div className="flex items-center gap-3">
                                        {tempLogo && <div className="w-10 h-10 bg-white rounded-lg border overflow-hidden shrink-0"><img src={tempLogo} alt="Logo" className="w-full h-full object-cover"/></div>}
                                        <input type="file" accept="image/*" onChange={handleLogoUpload} className="w-full text-xs font-semibold file:mr-3 file:py-2 file:px-3 file:rounded-lg file:border-0 file:bg-primary-50 file:text-primary-700 cursor-pointer text-slate-500"/>
                                    </div>
                                </div>
                                <div><label className="block text-[10px] font-black uppercase tracking-widest text-slate-500 mb-1.5">Tanggal Ujian</label><input type="date" value={tempDate} onChange={e=>setTempDate(e.target.value)} className="w-full p-3 rounded-xl border border-slate-300 bg-white text-[14px] font-semibold outline-none focus:ring-2 focus:ring-primary-500"/></div>
                                <div className="grid grid-cols-2 gap-3">
                                    <div><label className="block text-[10px] font-black uppercase tracking-widest text-slate-500 mb-1.5">Jam Mulai</label><input type="time" value={tempStartTime} onChange={e=>setTempStartTime(e.target.value)} className="w-full p-3 rounded-xl border border-slate-300 bg-white text-[14px] font-semibold outline-none focus:ring-2 focus:ring-primary-500"/></div>
                                    <div><label className="block text-[10px] font-black uppercase tracking-widest text-slate-500 mb-1.5">Jam Selesai</label><input type="time" value={tempEndTime} onChange={e=>setTempEndTime(e.target.value)} className="w-full p-3 rounded-xl border border-slate-300 bg-white text-[14px] font-semibold outline-none focus:ring-2 focus:ring-primary-500"/></div>
                                </div>
                                <div className="bg-white p-4 rounded-xl border space-y-3 mt-2">
                                    <label className="flex items-center cursor-pointer text-[14px] font-bold text-slate-700"><input type="checkbox" checked={tempRandomQ} onChange={e=>setTempRandomQ(e.target.checked)} className="w-4 h-4 mr-3 accent-primary-600 rounded"/> Acak Urutan Soal</label>
                                    <label className="flex items-center cursor-pointer text-[14px] font-bold text-slate-700"><input type="checkbox" checked={tempRandomOpt} onChange={e=>setTempRandomOpt(e.target.checked)} className="w-4 h-4 mr-3 accent-primary-600 rounded"/> Acak Opsi Pilihan Ganda</label>
                                </div>
                                <button onClick={saveSettings} disabled={isSaving} className="w-full bg-primary-700 text-white py-3.5 rounded-xl font-black uppercase tracking-widest shadow-md hover:bg-primary-800 transition-colors disabled:opacity-50 mt-4">{isSaving ? 'Menyimpan...' : 'Simpan Perubahan'}</button>
                            </div>
                        </div>
                    </div>
                </div>
                </AdminLayout>
             );
          };

          const AdminTokens = () => {
             const [isSaving, setIsSaving] = useState(false);
             const [showImport, setShowImport] = useState(false);
             const [fileUploadError, setFileUploadError] = useState('');
             const [isMassEdit, setIsMassEdit] = useState(false);
             const [massEditTokens, setMassEditTokens] = useState([]);
             
             const [selectedTokens, setSelectedTokens] = useState([]);
             const [downloadFilter, setDownloadFilter] = useState('Semua');
             const [editFilter, setEditFilter] = useState('Semua');
             
             const [showAddManualModal, setShowAddManualModal] = useState(false);
             const [manualForm, setManualForm] = useState({name: '', school: ''});

             const actualTokens = tokens.filter(t => !t.code.startsWith('SYS_SETTING_') && !t.code.startsWith('SYS_FOLDER_'));
             const uniqueClasses = [...new Set(actualTokens.map(t => t.participant_school).filter(Boolean))];
             const uniqueEditClasses = [...new Set(massEditTokens.map(t => t.participant_school).filter(Boolean))];
